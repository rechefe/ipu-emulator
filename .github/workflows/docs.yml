name: Documentation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pages: write
  id-token: write

# One run per ref. A newer push supersedes an older run on the same branch,
# but a master build-and-deploy is never cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          
      - name: Install Bazelisk
        run: |
          wget https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
      
      - name: Build documentation with Bazel
        env:
          # From giscus.app — add as repository Secrets (Settings → Secrets and variables → Actions).
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
          GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          GISCUS_MAPPING: ${{ vars.GISCUS_MAPPING }}
          GISCUS_THEME: ${{ vars.GISCUS_THEME }}
          GISCUS_LANG: ${{ vars.GISCUS_LANG }}
        run: |
          # --config=docs forwards the GISCUS_* variables into the build (.bazelrc).
          bazel build --config=docs //docs:build_docs
          mkdir -p site
          tar -xf bazel-bin/docs/site.tar -C site

      - name: Check giscus widget is rendered
        # Secrets are not available to fork PRs, so only check master pushes.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if ! tar -xOf bazel-bin/docs/site.tar ./index.html | grep -q 'data-repo-id="[^"]'; then
            echo "::error::index.html has no giscus widget; check the GISCUS_* secrets/variables and --config=docs."
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
