name: Release log

# Keeps the committed docs/content/release-log.md current, so the docs build
# never calls the GitHub API (IMPLEMENTATION-DECISIONS.md, E01-07).
#
# After every push to master (a merge) it merges the recently merged pull
# requests into the log. When a row changed, it commits the log to master and
# dispatches docs.yml so the site shows it. A push made with the workflow token
# starts no workflow by itself, so this cannot loop; workflow_dispatch is the
# one event that token may start.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-log
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Install toolchain
        run: ./tools/bootstrap.sh

      - name: Refresh, commit and push
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          log=docs/content/release-log.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            bazel run //docs:update_release_log -- --recent --output "$PWD/$log"
            # The footer's timestamp changes on every run; only a changed row counts.
            if git diff --quiet -I '^\*Last updated:' -- "$log"; then
              echo "No new merged pull request; nothing to commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add "$log"
            git commit -m "docs: refresh release log"
            if git push origin HEAD:master; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (master moved); retrying."
          done
          echo "::error::could not push the release log to master"
          exit 1

      - name: Rebuild the docs site
        if: steps.refresh.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref master
