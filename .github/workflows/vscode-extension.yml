name: VS Code Extension

# Generates the extension's language data from the assembler, proves it agrees
# with the parser and assembler on a real corpus, tests it in a real VS Code,
# then packages (and on master, publishes) the .vsix.
#
# The paths filters include ipu_as, ipu_isa and ipu_gen: the grammar,
# instruction set, operand types, case rules and register facts are read from
# them at build time (by ipu_gen/vscode_data.py). requirements_lock.txt and tools/bootstrap.sh change the
# build it runs, so pull requests that touch them run it too.
#
# Keep these paths in step with the package layout: E03's rename of ipu_isa
# to ipu_isa and the Q69 package split must update them.

on:
  # Master publishes, so only files that can change the packaged .vsix count:
  # test/** is excluded by .vscodeignore, and the generator reads nothing from
  # ipu_emu.
  push:
    branches: [ master ]
    paths:
      - 'vscode-ipu-asm/**'
      - '!vscode-ipu-asm/test/**'
      - 'src/tools/ipu-as-py/src/ipu_as/**'
      - 'src/tools/ipu-gen/**'
      - 'src/tools/ipu-isa/src/ipu_isa/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'vscode-ipu-asm/**'
      - 'src/tools/ipu-as-py/src/ipu_as/**'
      - 'src/tools/ipu-gen/**'
      - 'src/tools/ipu-isa/src/ipu_isa/**'
      - 'src/tools/ipu-emu-py/src/ipu_emu/**'
      - '.github/workflows/vscode-extension.yml'
      # PRs only: the test corpus and the runtime kernel manifest change no
      # bundled file, so on master they must not republish the extension.
      - 'src/tools/ipu-apps/**/*.asm'
      - 'src/tools/ipu-apps/src/ipu_apps/kernel_registry/**'
      - 'src/tools/ipu-apps/src/ipu_apps/kernels/**/*.py'
      - 'src/tools/ipu-apps/BUILD.bazel'
      - 'ipu_app.bzl'
      # PRs only: they change how the build runs, not what is packaged.
      - 'requirements_lock.txt'
      - 'tools/bootstrap.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The same pinned bazelisk as every other workflow.
      - name: Install toolchain
        run: ./tools/bootstrap.sh

      # Writes syntaxes/ipu-asm.tmLanguage.json and language-configuration.json
      # into the extension directory. Both are build outputs, not committed.
      - name: Generate grammar from the parser
        run: bazel run //vscode-ipu-asm:gen_vscode

      # Passed as arguments rather than declared as Bazel srcs, so the app
      # package needs no filegroup existing solely for this tool.
      - name: Dump the parser's tokenization of the corpus
        run: |
          bazel run //vscode-ipu-asm:dump_parser_tokens -- \
            "$PWD/parser-tokens.json" \
            "$PWD"/src/tools/ipu-apps/src/ipu_apps/**/*.asm \
            "$PWD"/src/tools/ipu-apps/test/**/*.asm \
            "$PWD/vscode-ipu-asm/test/corpus/edge_cases.asm"
        shell: bash --noprofile --norc -eo pipefail -O globstar {0}

      # The real VS Code tokenizer (Python's re is a different engine, so a
      # misleading oracle) and the VS Code test harness; --no-save keeps them
      # out of the vsix.
      - name: Install the test dependencies
        working-directory: vscode-ipu-asm
        run: npm install --no-save --no-package-lock vscode-textmate@9.3.2 vscode-oniguruma@2.0.1 @vscode/test-electron@2.5.2

      - name: Check the grammar agrees with the parser
        run: |
          node vscode-ipu-asm/test/agreement.js \
            parser-tokens.json \
            vscode-ipu-asm/syntaxes/ipu-asm.tmLanguage.json

      # Which checker the extension runs, and when it decides the prebuilt one
      # has gone stale. Needs no editor and no dependencies.
      - name: Check the checker selection rule
        run: node vscode-ipu-asm/test/checker.js

      - name: Check how checkouts are found
        run: node vscode-ipu-asm/test/project.js

      # The extension activated on a stand-in `vscode`: Restricted Mode runs nothing
      # (no API grants workspace trust inside VS Code, so the integration test cannot drive it).
      - name: Check what activation runs, and when
        run: node vscode-ipu-asm/test/activation.js

      - name: Check completion and navigation against the parser
        run: |
          node vscode-ipu-asm/test/language.js \
            vscode-ipu-asm/data/isa.json parser-tokens.json

      # A correct rename or format leaves the binary byte for byte the same.
      - name: Check renames and formatting leave the program unchanged
        run: |
          node vscode-ipu-asm/test/rewrites.js \
            vscode-ipu-asm/data/isa.json parser-tokens.json rewrites.json
          bazel run //vscode-ipu-asm:check_rewrites -- "$PWD/rewrites.json"

      # Both directions: the editor accepts a text exactly when the assembler does, over the
      # corpus, mutations of it and the negative corpus (test/corpus/negative), but for the
      # reviewed gaps in test/corpus/negative/allowed-gaps.json.
      - name: Check the editor and the assembler agree on what assembles
        run: |
          node vscode-ipu-asm/test/verdicts.js \
            vscode-ipu-asm/data/isa.json parser-tokens.json verdicts.json
          bazel run //vscode-ipu-asm:check_verdicts -- "$PWD/verdicts.json"

      # Read by the extension at runtime; building it proves Bazel's targets and
      # the registry agree.
      - name: Build the kernel manifest
        run: |
          bazel run --ui_event_filters=-info,-stdout,-stderr --noshow_progress \
            //src/tools/ipu-apps:kernel_manifest > kernel-manifest.json

      - name: Check the run commands against the manifest
        run: node vscode-ipu-asm/test/runs.js kernel-manifest.json

      # The VS Code version is pinned in run.js; diagnostics use the built checker.
      - name: Test the extension in VS Code
        run: |
          bazel build //src/tools/ipu-as-py:ipu-as
          checker="$(bazel info bazel-bin)/src/tools/ipu-as-py/ipu-as"
          export IPU_TEST_CHECK_COMMAND="[\"$checker\", \"check\", \"--json\", \"--input\"]"
          xvfb-run -a node vscode-ipu-asm/test/integration/run.js

      # The Marketplace refuses a version it has already seen, so every publish
      # needs a new one. The patch number comes from the run counter rather than
      # from a commit: writing a bumped package.json back to master would land
      # under this workflow's own paths filter and retrigger it indefinitely.
      # `--no-git-tag-version` keeps the edit local to the runner.
      - name: Set the published version
        working-directory: vscode-ipu-asm
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "${base}.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          node -p "'publishing version ' + require('./package.json').version"

      # --no-dependencies skips vsce's `npm list --production` probe. The vsce
      # version is pinned because an unpinned npx floats onto the next major.
      # --skip-license and </dev/null keep it from stopping on an interactive
      # "continue? [y/N]", which would hang or abort the job.
      - name: Package vsix
        working-directory: vscode-ipu-asm
        run: |
          npx --yes @vscode/vsce@3.6.0 package \
            --no-dependencies --skip-license --out ipu-asm.vsix < /dev/null

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v5
        with:
          name: ipu-asm-vsix
          path: vscode-ipu-asm/ipu-asm.vsix

      # Publishes the exact vsix that was just built and checked, rather than
      # repackaging. Skipped when VSCE_PAT is unset, so the release path below
      # still works before the Marketplace publisher is set up — a missing
      # secret should not fail an otherwise good build.
      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: vscode-ipu-asm
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT is not set; skipping Marketplace publish." >&2
            exit 0
          fi
          npx --yes @vscode/vsce@3.6.0 publish \
            --packagePath ipu-asm.vsix --skip-license < /dev/null

      # Gated on master, mirroring how docs.yml gates its Pages deployment.
      - name: Publish rolling prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vscode-latest >/dev/null 2>&1 \
            || gh release create vscode-latest --prerelease \
                 --title "IPU Assembly VS Code extension (latest master)" \
                 --notes "Rebuilt automatically from master."
          gh release upload vscode-latest vscode-ipu-asm/ipu-asm.vsix --clobber
          gh release edit vscode-latest \
            --notes "Rebuilt automatically from master (${GITHUB_SHA})."
