<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -25 850 445" width="850" height="445" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
  </defs>
  <rect y="-25" width="850" height="445" fill="#fff"/>

  <!-- LUT range: -2^max_exp .. 0 -->
  <rect x="340" y="45" width="190" height="335" fill="#2e9e8c" fill-opacity="0.15"/>
  <text x="435" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a7060">LUT</text>
  <text x="435" y="292" text-anchor="middle" fill="#1a7060">256 entries</text>

  <!-- axes -->
  <line x1="40" y1="110" x2="820" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#axis)"/>
  <line x1="530" y1="395" x2="530" y2="-12" stroke="#222" stroke-width="1.5" marker-end="url(#axis)"/>
  <text x="828" y="115" fill="#222">x</text>
  <text x="512" y="-4" fill="#222">y</text>

  <!-- LUT curve inside the range -->
  <path d="M530 65 C 465 65, 425 185, 340 205" fill="none" stroke="#1a7060" stroke-width="2.5"/>

  <!-- range limit -->
  <line x1="340" y1="38" x2="340" y2="380" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340" y="28" text-anchor="middle" fill="#222">−2<tspan baseline-shift="super" font-size="10">max_exp</tspan></text>

  <!-- below the range: range_mode selects one of two results -->
  <line x1="340" y1="300" x2="240" y2="400" stroke="#c0392b" stroke-width="2.5"/>
  <text x="232" y="392" text-anchor="end" fill="#c0392b">f(x) = x (identity)</text>

  <line x1="60" y1="250" x2="340" y2="250" stroke="#4a80c4" stroke-width="2.5"/>
  <text x="50" y="240" fill="#2a5090">f(x) = neg_c (positive or negative)</text>

  <!-- identity: the same value x on the two axes -->
  <line x1="290" y1="350" x2="530" y2="350" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="290" y1="110" x2="290" y2="350" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="290" cy="350" r="4" fill="#c0392b"/>
  <text x="542" y="355" fill="#c0392b">x</text>
  <text x="290" y="100" text-anchor="middle" fill="#c0392b">x</text>

  <text x="60" y="300" fill="#222">range_mode selects</text>
  <text x="60" y="318" fill="#222">one of the two results</text>

  <!-- positive x: range_mode selects one of two results -->
  <line x1="530" y1="110" x2="630" y2="10" stroke="#c0392b" stroke-width="2.5"/>
  <text x="640" y="4" fill="#c0392b">f(x) = x (identity)</text>
  <line x1="530" y1="35" x2="840" y2="35" stroke="#4a80c4" stroke-width="2.5"/>
  <text x="600" y="55" fill="#2a5090">f(x) = pos_c (positive or negative)</text>
  <text x="650" y="80" fill="#222">range_mode selects</text>
  <text x="650" y="98" fill="#222">one of the two results</text>
</svg>
