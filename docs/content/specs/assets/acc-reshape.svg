<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802 270" width="802" height="270" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- ACC.RESHAPE example: number_idx = 6; source = 5 9 127 100 64 42 33 20; dest = 0 1 18 40 64 90 101 126; one column per k -->
  <rect width="802" height="270" fill="#ffffff"/>
