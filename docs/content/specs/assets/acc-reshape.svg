  <line x1="236.0" y1="106" x2="236.0" y2="168" stroke="#1a7060" stroke-width="2" marker-end="url(#ah)"/>
  <text x="320.0" y="60" text-anchor="middle" fill="#666" font-size="12">k = 2</text>
