  <text x="152.0" y="193.0" text-anchor="middle" fill="#fff" font-size="15">0</text>
  <line x1="152.0" y1="106" x2="152.0" y2="168" stroke="#1a7060" stroke-width="2" marker-end="url(#ah)"/>
  <text x="236.0" y="60" text-anchor="middle" fill="#666" font-size="12">k = 1</text>
  <rect x="198" y="70" width="76" height="36" fill="#2e9e8c" stroke="#1a7060"/>
