<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 270" width="1030" height="270" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- IPU data flow: XMEM row to the stages and back to XMEM -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1030" height="270" fill="#ffffff"/>

  <!-- Stages -->
  <rect x="25" y="110" width="450" height="140" fill="none" stroke="#888" stroke-width="2"/>
  <text x="35" y="130" fill="#222" font-weight="bold" font-size="12">Mult and Load</text>
  <rect x="535" y="110" width="130" height="140" fill="none" stroke="#888" stroke-width="2"/>
  <text x="545" y="130" fill="#222" font-weight="bold" font-size="12">Accumulator</text>
  <rect x="725" y="110" width="280" height="140" fill="none" stroke="#888" stroke-width="2"/>
  <text x="735" y="130" fill="#222" font-weight="bold" font-size="12">Activation and Quantization</text>

  <!-- XMEM -->
  <rect x="40" y="20" width="120" height="50" fill="#ffffff" stroke="#222"/>
  <text x="100" y="50" text-anchor="middle" fill="#222" font-weight="bold">XMEM</text>

  <!-- Blocks -->
  <rect x="40" y="160" width="120" height="60" fill="#2e9e8c" stroke="#1a7060"/>
  <text x="100" y="186" text-anchor="middle" fill="#fff">Load</text>
  <text x="100" y="204" text-anchor="middle" fill="#fff" font-size="11">R0, R1, R_CYCLIC</text>

  <rect x="210" y="160" width="100" height="60" fill="#2e9e8c" stroke="#1a7060"/>
  <text x="260" y="186" text-anchor="middle" fill="#fff">NX8 to</text>
  <text x="260" y="204" text-anchor="middle" fill="#fff">FP32</text>

  <rect x="360" y="160" width="100" height="60" fill="#2e9e8c" stroke="#1a7060"/>
  <text x="410" y="195" text-anchor="middle" fill="#fff">Multiply</text>

  <rect x="550" y="160" width="100" height="60" fill="#2e9e8c" stroke="#1a7060"/>
  <text x="600" y="186" text-anchor="middle" fill="#fff">Accumulate</text>
  <text x="600" y="204" text-anchor="middle" fill="#fff" font-size="11">R_ACC</text>

  <rect x="740" y="160" width="100" height="60" fill="#2e9e8c" stroke="#1a7060"/>
  <text x="790" y="195" text-anchor="middle" fill="#fff">Activate</text>

  <rect x="890" y="160" width="100" height="60" fill="#2e9e8c" stroke="#1a7060"/>
  <text x="940" y="195" text-anchor="middle" fill="#fff">Quantize</text>

  <!-- Arrows -->
  <path d="M100 70 V158" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="108" y="95" fill="#222" font-size="12">NX8</text>

  <path d="M160 190 H208" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="183" text-anchor="middle" fill="#222" font-size="12">NX8</text>

  <path d="M310 190 H358" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="183" text-anchor="middle" fill="#222" font-size="12">FP32</text>

  <path d="M460 190 H548" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="183" text-anchor="middle" fill="#222" font-size="12">FP32</text>

  <path d="M650 190 H738" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="695" y="183" text-anchor="middle" fill="#222" font-size="12">FP32</text>

  <path d="M840 190 H888" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="865" y="183" text-anchor="middle" fill="#222" font-size="12">FP32</text>

  <path d="M940 160 V45 H162" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="948" y="95" fill="#222" font-size="12">NX8</text>
</svg>
