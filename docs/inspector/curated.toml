# The Cycle Inspector's kernel list (E08-16). One [[kernel]] per CURATED entry
# in BUILD.bazel, in the same order (the page's); `id` is the entry's name.
# //docs/inspector:test_kernels and :kernels_json check that the two agree.
#
# group: "native" (8-bit hardware formats) or "wide" (wide-vector debug,
# emulator-only FP32/INT32). label: the format as the kernel button shows it.

[[kernel]]
id = "tour_int8"
group = "native"
title = "Vector tour"
label = "INT8"
description = """The vector_tour conformance program: loads a mask, two R_CYCLIC slots and \
R0/R1, then runs MULT.VE, MULT.RC.VV/VS/VE and MULT.EE into ACC.ADD/SUB/MAX, masked \
multiplies, and a 4-row matrix-vector loop with AGG.SUM.FIRST. INT8 lanes multiply into INT32 MULT_RES and R_ACC; the run ends with ACTIVATE.QUANTIZE RELU and a store of POST_AAQ_REG."""

[[kernel]]
id = "tour_e4"
group = "native"
title = "Vector tour"
label = "FP8 E4M3"
description = """The vector_tour conformance program: loads a mask, two R_CYCLIC slots and \
R0/R1, then runs MULT.VE, MULT.RC.VV/VS/VE and MULT.EE into ACC.ADD/SUB/MAX, masked \
multiplies, and a 4-row matrix-vector loop with AGG.SUM.FIRST. FP8 E4M3 lanes multiply into FP32 MULT_RES and R_ACC. ACTIVATE.QUANTIZE needs INT8, so results leave through stores of R_ACC."""

[[kernel]]
id = "tour_e5"
group = "native"
title = "Vector tour"
label = "FP8 E5M2"
description = """The vector_tour conformance program: loads a mask, two R_CYCLIC slots and \
R0/R1, then runs MULT.VE, MULT.RC.VV/VS/VE and MULT.EE into ACC.ADD/SUB/MAX, masked \
multiplies, and a 4-row matrix-vector loop with AGG.SUM.FIRST. FP8 E5M2: wider range and 2 mantissa bits, so products round more coarsely than in E4M3."""

[[kernel]]
id = "tour_e3"
group = "native"
title = "Vector tour"
label = "FP8 E3M4"
description = """The vector_tour conformance program: loads a mask, two R_CYCLIC slots and \
R0/R1, then runs MULT.VE, MULT.RC.VV/VS/VE and MULT.EE into ACC.ADD/SUB/MAX, masked \
multiplies, and a 4-row matrix-vector loop with AGG.SUM.FIRST. FP8 E3M4: 4 mantissa bits, narrow range."""

[[kernel]]
id = "fc_int8"
group = "native"
title = "Fully connected"
label = "INT8"
description = """Dense layer, 10 samples × 128 inputs → 64 outputs on native 128 × INT8 \
vectors, accumulated in INT32 R_ACC. One word per input element: LR address updates, \
MULT.RC.VE, ACC.ADD, the next weight-row load and the loop branch."""

[[kernel]]
id = "fc_e4"
group = "native"
title = "Fully connected"
label = "FP8 E4M3"
description = "The same dense layer on native FP8 E4M3 vectors with FP32 accumulation."

[[kernel]]
id = "fc_e5"
group = "native"
title = "Fully connected"
label = "FP8 E5M2"
description = "The same dense layer on native FP8 E5M2 vectors with FP32 accumulation."

[[kernel]]
id = "fully_connected"
group = "wide"
title = "Fully connected"
label = "INT32 wide"
description = "The default fully_connected case: wide-vector debug mode with INT32 lanes."

[[kernel]]
id = "identity"
group = "wide"
title = "Identity copy"
label = "FP32 wide"
description = """Copies a 3 × 128 FP32 matrix one XMEM row at a time: MULT.VE by the \
hardware constant 1.0 (CR1), ACC.ADD.FIRST, ACTIVATE.QUANTIZE, then a store of POST_AAQ_REG."""

[[kernel]]
id = "channel_peak"
group = "wide"
title = "Channel peak"
label = "FP32 wide"
description = """Detector confidence over 4 channels × 16 cells: ACC.MAX across channel \
planes, ACC.SUB of the threshold, ReLU gate via ACTIVATE.QUANTIZE."""

[[kernel]]
id = "softmax_rows"
group = "wide"
title = "Row softmax"
label = "FP32 wide"
description = """Numerically stable softmax over 2 rows: AGG.MAX for the row maximum, the \
native exp2 activation, AGG.SUM for the denominator, MULT.EE to normalise."""

[[kernel]]
id = "depth_to_space"
group = "wide"
title = "Depth to space"
label = "FP32 wide"
description = """Pixel shuffle, upscale factor 2, 2 × 8 grid. ACC.RESHAPE scatters eight \
MULT_RES elements per instruction into arbitrary R_ACC slots, indexed by LRD pairs."""

[[kernel]]
id = "conv_universal"
group = "wide"
title = "3×3 convolution"
label = "FP32 wide"
description = """Standard 3×3 conv2d. Three vertically neighbouring 128-element input chunks \
rotate through the four R_CYCLIC slots; each tap is one MULT.RC.VE (all 128 lanes × one \
weight) and an ACC.ADD into R_ACC. Edge lanes are masked."""

[[kernel]]
id = "residual_add"
group = "wide"
title = "Residual add"
label = "FP32 wide"
description = """FP32 element-wise add of two 64-channel tensors: MULT.RC.VE by 1.0 copies \
each chunk, ACC.ADD.FIRST and ACC.ADD sum them, and a store writes R_ACC back."""
