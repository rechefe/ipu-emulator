# The Cycle Inspector's kernel list (E08-16). One [[kernel]] per CURATED entry
# in BUILD.bazel, in the same order (the page's); `id` is the entry's name.
# //docs/inspector:test_kernels and :kernels_json check that the two agree.
#
# group: "hardware" (NX8 rows, the hardware mode) or "emulator" (the emulator-only
# FP32 mode; ADR 0007). label: the format as the kernel button shows it.

[[kernel]]
id = "tour_e4"
group = "hardware"
title = "Vector tour"
label = "NX8 E4"
description = """The vector_tour conformance program: loads a mask, two R_CYCLIC slots and \
R0/R1, then runs MULT.VE, MULT.RC.VV/VS/VE and MULT.EE into ACC.ADD/SUB/MAX, masked \
multiplies, and a 4-row matrix-vector loop with AGG.SUM.FIRST. NX8 e4 rows: each element is \
decoded with the QF half in CR14.L and the scale in its row's metadata, multiplied into FP32 \
MULT_RES and R_ACC, and every result row leaves through ACTIVATE.QUANTIZE (identity, then relu), \
which quantizes it back to one NX8 row with its own scale."""

[[kernel]]
id = "tour_e5"
group = "hardware"
title = "Vector tour"
label = "NX8 E5"
description = """The vector_tour conformance program: loads a mask, two R_CYCLIC slots and \
R0/R1, then runs MULT.VE, MULT.RC.VV/VS/VE and MULT.EE into ACC.ADD/SUB/MAX, masked \
multiplies, and a 4-row matrix-vector loop with AGG.SUM.FIRST. NX8 e5: wider range and fewer \
mantissa bits than e4, so each ACTIVATE.QUANTIZE store rounds more coarsely."""

[[kernel]]
id = "tour_e3"
group = "hardware"
title = "Vector tour"
label = "NX8 E3"
description = """The vector_tour conformance program: loads a mask, two R_CYCLIC slots and \
R0/R1, then runs MULT.VE, MULT.RC.VV/VS/VE and MULT.EE into ACC.ADD/SUB/MAX, masked \
multiplies, and a 4-row matrix-vector loop with AGG.SUM.FIRST. NX8 e3: more mantissa bits, \
narrow range; the row scale in the metadata carries the magnitude."""

[[kernel]]
id = "tour_dynamic"
group = "hardware"
title = "Vector tour"
label = "NX8 dynamic"
description = """The vector_tour conformance program: loads a mask, two R_CYCLIC slots and \
R0/R1, then runs MULT.VE, MULT.RC.VV/VS/VE and MULT.EE into ACC.ADD/SUB/MAX, masked \
multiplies, and a 4-row matrix-vector loop with AGG.SUM.FIRST. Dynamic NX8: each \
ACTIVATE.QUANTIZE store picks the exponent width of its row from the data and records it in \
the row's metadata (dynamic_exponent), which a MULT that later loads the row reads back."""

[[kernel]]
id = "fc_e4"
group = "hardware"
title = "Fully connected"
label = "NX8 E4"
description = """Dense layer, 10 samples × 128 inputs → 64 outputs on NX8 e4 rows, \
accumulated in FP32 R_ACC. One word per input element: LR address updates, MULT.RC.VE, \
ACC.ADD, the next weight-row load and the loop branch; each sample's outputs leave through one \
ACTIVATE.QUANTIZE store."""

[[kernel]]
id = "fc_e5"
group = "hardware"
title = "Fully connected"
label = "NX8 E5"
description = "The same dense layer on NX8 e5 rows."

[[kernel]]
id = "fc_dynamic"
group = "hardware"
title = "Fully connected"
label = "NX8 dynamic"
description = "The same dense layer on dynamic NX8 rows: each row's exponent width is in its metadata."

[[kernel]]
id = "identity"
group = "emulator"
title = "Identity copy"
label = "FP32"
description = """Copies a 3 × 128 FP32 matrix one XMEM row at a time: MULT.VE by the \
hardware constant 1.0 (CR1), ACC.ADD.FIRST, then ACTIVATE.EXACT identity, which stores the row."""

[[kernel]]
id = "channel_peak"
group = "emulator"
title = "Channel peak"
label = "FP32"
description = """Detector confidence over 4 channels × 16 cells: ACC.MAX across channel \
planes, ACC.SUB of the threshold, ReLU gate and store via ACTIVATE.EXACT."""

[[kernel]]
id = "softmax_rows"
group = "emulator"
title = "Row softmax"
label = "FP32"
description = """Numerically stable softmax over 2 rows: AGG.MAX for the row maximum, the \
exact exp2 activation (ACTIVATE.EXACT), AGG.SUM for the denominator, MULT.EE to normalise."""

[[kernel]]
id = "depth_to_space"
group = "emulator"
title = "Depth to space"
label = "FP32"
description = """Pixel shuffle, upscale factor 2, 2 × 8 grid. ACC.RESHAPE scatters eight \
MULT_RES elements per instruction into arbitrary R_ACC slots, indexed by LRD pairs."""

[[kernel]]
id = "conv_universal"
group = "emulator"
title = "3×3 convolution"
label = "FP32"
description = """Standard 3×3 conv2d. Three vertically neighbouring 128-element input chunks \
rotate through the four R_CYCLIC slots; each tap is one MULT.RC.VE (all 128 lanes × one \
weight) and an ACC.ADD into R_ACC. Edge lanes are masked."""

[[kernel]]
id = "residual_add"
group = "emulator"
title = "Residual add"
label = "FP32"
description = """FP32 element-wise add of two 64-channel tensors: MULT.RC.VE by 1.0 copies \
each chunk, ACC.ADD.FIRST and ACC.ADD sum them, and ACTIVATE.EXACT identity writes R_ACC back."""
