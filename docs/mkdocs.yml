site_name: IPU Emulator
site_description: Documentation for IPU emulator and assembly language
site_author: IPU Development Team
# Markdown lives under content/ (MkDocs requires docs_dir to be a subdirectory of the project).
docs_dir: content
repo_url: https://github.com/rechefe/ipu-emulator
repo_name: rechefe/ipu-emulator
edit_uri: edit/master/docs/

hooks:
  - hooks/giscus_env.py
  - hooks/history_link.py

plugins:
  - search
  # When a page moves, map its old path to the new one here so old URLs keep working.
  - redirects:
      redirect_maps:
        # E09-14 moved the ISA reference under reference/isa/.
        instructions.md: reference/isa/instructions.md
        operand-types.md: reference/isa/operand-types.md
        assembly-syntax.md: reference/isa/assembly-syntax.md
        programmer-guide.md: reference/isa/programmer-guide.md
        instruction-format.md: reference/isa/instruction-format.md
        ipu-configuration.md: reference/isa/configuration-registers.md
        # E09-19 folded the emulator-only formats into the element-formats page.
        wide-vector-debug-mode.md: explanation/element-formats.md
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      enable_parallel_processing: false
      # Pages generated by Bazel have no git history, so the plugin would stamp
      # them with the build time and no two builds of a commit would match.
      # Keep in step with extra.generated_pages below.
      exclude:
        - reference/isa/instructions.md
        - reference/isa/operand-types.md
        - reference/isa/assembly-syntax.md
        - reference/isa/programmer-guide.md
        - reference/isa/instruction-format.md
        - reference/isa/registers.md
        - reference/isa/configuration-registers.md

theme:
  name: material
  custom_dir: overrides
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.integrate
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Getting Started guide (PDF): https://github.com/rechefe/ipu-emulator/releases/download/guide-latest/getting-started.pdf
  - How-to:
      - how-to/index.md
      - Write a kernel: building-applications.md            # E09-09
      - Register a kernel: adding-applications.md           # E09-09 merges it
      - Add an instruction: how-to/add-an-instruction.md    # E09-11
      - Debug a kernel: debugging.md                        # E09-12; the Cycle Inspector page (E08) goes here
      - Step through a kernel run: debugging-inspector.md   # E08-17; E09 decides its final place
      - Cycle Inspector: inspector/index.html               # E08-17: the static viewer page
      - Use the reference model from cocotb: how-to/reference-model-cocotb.md   # E09-13
  - Reference:
      - reference/index.md
      - ISA:                                                # generated, E09-14
          - Instructions: reference/isa/instructions.md
          - Operand types: reference/isa/operand-types.md
          - Registers: reference/isa/registers.md
          - Configuration registers: reference/isa/configuration-registers.md
          - Assembly syntax: reference/isa/assembly-syntax.md
          - Instruction format: reference/isa/instruction-format.md
          - Programmer's guide: reference/isa/programmer-guide.md
      - Command-line tools: reference/cli.md                # E09-15; option tables generated (docs/cli_reference_page.py)
      - Reference model API: reference/reference-model-api.md   # E09-16; parts generated (docs/reference_api_page.py)
      - Kernels:                                            # E06/E07 generate these
          - kernels/index.md
          - Softmax: kernels/softmax.md
          - Convolutions: kernels/convolutions.md
          - Linear layers: kernels/linear-layers.md
          - Normalization and shaping: kernels/normalization-and-shaping.md
          - Attention: kernels/attention.md
          - MobileViT-S: kernels/mobilevit.md
      - Code conventions: code-conventions.md               # E01-12
      - Code review: code-review.md                         # E01-13
      - Glossary: reference/glossary.md
  - Explanation:
      - explanation/index.md
      - Architecture: explanation/architecture.md           # placeholder, E09-17
      - Prototyping mode: prototyping-mode.md               # E09-17 folds it in
      - Timing model: explanation/timing-model.md
      - Element formats: explanation/element-formats.md
      - ISA idioms: isa-alias-catalogue.md                  # E09-10
      - Kernel coverage: app-coverage.md                    # E09-10
  - Specs and requirements:
      - Specs:
          - Cache Unit Specification: specs/cache-unit.md
          - AaQ Stage Specification: specs/stage-aaq-str.md
          - Accumulator Stage Specification: specs/stage-accumulator.md
          - Control Stage Specification: specs/stage-control.md
          - RISC-V Host Integration: specs/riscv-host-integration.md
          - Mnemonic rename (SV names): specs/mnemonic-rename.md
          - RTL migration (SV package): specs/rtl-migration.md
      - HW requirements:
          - Overview and goals: requirements/index.md
          - Architecture and pipeline: requirements/architecture.md
          - External interfaces: requirements/interfaces.md
          - Execution flow: requirements/execution-flow.md
          - Memory access: requirements/memory-access.md
          - Faults: requirements/faults.md
          - Debug: requirements/debug.md
          - Host registers: requirements/host-registers.md
  - Open questions: requirements/open-questions.md
  - Release log: release-log.md

# A page added without a nav entry shows a warning.
validation:
  nav:
    omitted_files: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # GLOSSARY.md sits at the repository root, one level above docs/ (the Bazel
      # docs build links it into the same place relative to its temp tree).
      base_path: [".."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

extra:
  docs_git_branch: master
  # The version selector (E09-21). CI publishes each build into gh-pages in mike's
  # layout: dev from master, vX.Y from a release tag, with the alias latest on the
  # newest release (docs/publish_version.py). The site root redirects to latest,
  # or to dev until the first release.
  version:
    provider: mike
    default: latest
  # Pages generated at build time (docs/BUILD.bazel) are not in docs/content/, so their
  # "history" link (hooks/history_link.py) goes to the generator instead. This map is the
  # one place to update when a generator or a generated page moves.
  generated_pages:
    reference/isa/instructions.md: src/tools/ipu-gen/src/ipu_gen/docs_pages.py
    reference/isa/operand-types.md: src/tools/ipu-gen/src/ipu_gen/docs_pages.py
    reference/isa/assembly-syntax.md: src/tools/ipu-gen/src/ipu_gen/docs_pages.py
    reference/isa/programmer-guide.md: src/tools/ipu-gen/src/ipu_gen/docs_pages.py
    reference/isa/instruction-format.md: src/tools/ipu-gen/src/ipu_gen/docs_pages.py
    reference/isa/registers.md: src/tools/ipu-gen/src/ipu_gen/docs_pages.py
    reference/isa/configuration-registers.md: src/tools/ipu-gen/src/ipu_gen/docs_pages.py
  # giscus IDs are public (they are rendered into every page), so they are committed
  # here (IMPLEMENTATION-DECISIONS.md, E00-06). Values come from https://giscus.app,
  # or GraphQL: repository.id and repository.discussionCategories[].id.
  # category_id: the "Announcements" category id (DIC_...) still has to be filled in
  # by a human (planning/architecture-deepening/00-verified-fixes/13-giscus-category-id.md).
  # Until then the widget renders only when the GISCUS_CATEGORY_ID secret is set, and
  # without it the docs workflow's master-only giscus check fails.
  # GISCUS_* environment variables override these values; Bazel forwards them only
  # with `bazel build --config=docs //docs:build_docs` (see .bazelrc).
  giscus:
    repo: rechefe/ipu-emulator
    repo_id: "R_kgDOQZJnxQ"
    category: Announcements
    category_id: ""
    mapping: pathname
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: bottom
    theme: preferred_color_scheme
    lang: en
    strict: "0"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rechefe/ipu-emulator
  generator: false
