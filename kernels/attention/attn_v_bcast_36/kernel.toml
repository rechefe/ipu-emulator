# attn_v_bcast_36: L3 attn@V, key-major P, a per-lane ACC.ADD fold (no AGG):
# y[h, t, i] = sum_s P[h, s, i] V[h, t, s] for 4 heads, 256 tokens, head_dim 36.
# Takes the scores of attn_scores_km_256x36 (the key-major chain).
[kernel]
op = "attn_v_bcast"                         # a separate op per chain stage keeps the query-major and key-major chains apart
formats = ["fp32"]

[params]
n_tok = { type = "int", choices = [256], default = 256 }   # fixed; a query may leave it out (the kernel is named by d) or must give this value
d = { type = "int", choices = [36] }   # fixed: the kernel takes exactly its layer's (n_tok, d)
n_head = { type = "int", choices = [4], default = 4 }   # geometry, not in a query: the default keeps (n_tok, d) queries routable
seed = { type = "int", default = 0xA17 }   # the old RandomState seed (0xA17); generator only
pad = { type = "float", default = 0.0 }   # the padding lanes of a and b (pack "padded"): 0, as the old harness staged them

# The old placement: the inputs back to back from row 0 in the order below, then the output; first fit in
# declaration order reproduces it (E07-12/13).
[inputs.b]                         # P KEY-major: row (h, s) holds the n_tok queries of key s
pack = "padded"
shape = ["n_head", "n_tok", "n_tok"]

[inputs.a]                         # V channel-major: row (h, t) holds n_tok keys
pack = "padded"
shape = ["n_head", "d", "n_tok"]

[outputs.y]                             # O channel-major: row (h*d + t) holds n_tok queries (2 rows per channel at n_tok = 256)
shape = ["n_head", "d", "n_tok"]
# ST.AAQ, one row per store, in row order

[derived]
v_hi_off = "1"           # CR5: R1 source offset (rows)
key_start = "-1"         # CR6
p_head_stride = "2 * n_tok" # CR7: 512 rows
key_bound = "n_tok - 2"  # CR8: 254
chan_bound = "d - 1"     # CR9: 35
head_bound = "n_head - 1" # CR10: 3
group_bound = "1"        # CR11: 2 query groups
rc_slot0 = "0"           # LR0
pv_stride = "n_tok / 128" # LR1: 2
out_row_stride = "1"     # LR2
group_query_off = "1"    # LR3

[abi]
b = "CR2"        # P_BASE
a = "CR3"        # V_BASE
y = "CR4"        # OUT_BASE
v_hi_off = "CR5"
key_start = "CR6"
p_head_stride = "CR7"
key_bound = "CR8"
chan_bound = "CR9"
head_bound = "CR10"
group_bound = "CR11"
rc_slot0 = "LR0"
pv_stride = "LR1"
out_row_stride = "LR2"
group_query_off = "LR3"
# CR15 unbound -> default dstructure (valid_elements = 128), as legacy
# Zero-valued LR presets are bound on purpose: in a Chain (E06-15) LRs carry over from the previous step.

[golden]
op = "matmul"                          # y = a @ b in the logical shapes above (batched over the leading dim)
tolerance = { fp32 = "FP32_LONG" }     # K = 256 float32 ACC.ADD steps; bit-exact to acc_fold in the family test_datapath.py

[cases.default]
n_tok = 256
d = 36
n_head = 4
seed = 0xA17
generator = "../gen.py:legacy_attn_v_bcast"
