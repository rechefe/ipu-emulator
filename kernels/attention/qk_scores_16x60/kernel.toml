# qk_scores_16x60: L5 QK^T scores, query-major, one head: y[i, s] = sum_c
# Q[i, c] K[s, c] for 16 tokens and head_dim 60. Pairs with attn_v_16x60 (the
# query-major chain), never with attn_v_bcast_60.
[kernel]
op = "qk_scores"                            # a separate op per chain stage keeps the query-major and key-major chains apart
formats = ["fp32"]

[params]
n_tok = { type = "int", choices = [16] }   # fixed: the kernel takes exactly its layer's (n_tok, d)
d = { type = "int", choices = [60] }   # fixed: the kernel takes exactly its layer's (n_tok, d)
seed = { type = "int", default = 0x5C0 }   # the old RandomState seed (0x5C0); generator only
pad = { type = "float", default = 0.0 }   # the padding lanes of b (pack "padded"): 0, as the old harness staged them

[derived]
k_start = "-1"           # CR5: -K_STRIDE_ROWS
chan_start = "-1"        # CR7
chan_bound_unread = "d - 2" # CR8: written by the harness, read by no instruction: bound so the registers match the old setup (E07-12/13)
rc_slot0 = "0"           # LR0
k_stride = "1"           # LR2: K_STRIDE_ROWS
out_stride = "1"         # LR3: N_TG * 1
chan_bound = "d - 2"     # LR6: the contraction bound (the program raises it by one into LR11)
out_ptr = "0"            # LR7
q_ptr = "0"              # LR8
q_index = "0"            # LR9
q_stride = "1"           # LR12
dstruct = "ds(n_tok)" # CR15: valid_elements = n_tok
qf = "case_qf"           # the case's QF half (0: FP32 ignores it)

# The old placement: the inputs back to back from row 0 in the order below, then the output; first fit in
# declaration order reproduces it (E07-12/13).
[inputs.b]                         # K, channel-major: row c holds the n_tok keys of channel c
pack = "padded"
shape = ["d", "n_tok"]
row = 0

[inputs.a]                         # Q staged query-major: row i holds query i's d channels (gen.py transposes the old channel-major draw)
shape = ["n_tok", "d"]

[outputs.y]                             # S query-major: row (i, g) holds keys [g*128, g*128+128) -- RowMajor over n_tok keys
pack = "padded"                    # the row-major rows under the name attn_v's P takes, so a Chain hands the scores over in place
shape = ["n_tok", "n_tok"]
# ACTIVATE.EXACT, one row per store, in row order

[abi]
b = "CR0"        # read through the hardwired 0: b is pinned at row 0
a = "CR9"        # QROW_BASE
y = "CR3"        # S_BASE
k_start = "CR5"
chan_start = "CR7"
chan_bound_unread = "CR8"
rc_slot0 = "LR0"
k_stride = "LR2"
out_stride = "LR3"
chan_bound = "LR6"
out_ptr = "LR7"
q_ptr = "LR8"
q_index = "LR9"
n_tok = "LR10"
q_stride = "LR12"
dstruct = "CR15"
qf = "CR14"
# Zero-valued LR presets are bound on purpose: in a Chain (E06-15) LRs carry over from the previous step.

[golden]
op = "matmul"                          # y = a @ b in the logical shapes above (batched over the leading dim)
tolerance = { fp32 = "FP32_ORDER" }    # a short contraction (d terms); the old check: rtol=1e-4, atol=1e-3 vs Q.T @ K.

[cases.default]
n_tok = 16
d = 60
seed = 0x5C0
generator = "../gen.py:seeded_uniform_qk"

# Garbage (1e3) in K's padding lanes, as a chained producer leaves another
# stream's data there: the stored rows stay zero past n_tok (the old
# stored-extent probe; test_padding.py reads the raw rows).
[cases.padding_not_stored]
n_tok = 16
d = 60
seed = 0x5C1
pad = 1000.0
generator = "../gen.py:seeded_uniform_qk"
