# qk_scores_256x36: L3 QK^T scores, query-major, one head: y[i, s] = sum_c
# Q[i, c] K[s, c] for 256 tokens (two 128-key groups) and head_dim 36. Pairs
# with attn_v_256x36 (the query-major chain), never with attn_v_bcast_36.
[kernel]
op = "qk_scores"                            # a separate op per chain stage keeps the query-major and key-major chains apart
formats = ["fp32"]

[params]
n_tok = { type = "int", choices = [256] }   # fixed: the kernel takes exactly its layer's (n_tok, d)
d = { type = "int", choices = [36] }   # fixed: the kernel takes exactly its layer's (n_tok, d)
seed = { type = "int", default = 0x9C0 }   # the old RandomState seed (0x9C0); generator only

[derived]
k_start_g0 = "-2"        # CR5: -K_STRIDE_ROWS
k_start_g1 = "-1"        # CR6: -K_STRIDE_ROWS + 1
chan_start = "-1"        # CR7
chan_last = "d - 1"     # CR8: the contraction bound (BLT.S sees the already-stepped index)
k_stride = "n_tok / 128" # CR11: 2 rows per K channel column, and per query in S (one per key group)
qf = "case_qf"           # the case's QF half (0: FP32 ignores it)

# The old placement: the inputs back to back from row 0 in the order below, then the output; first fit in
# declaration order reproduces it (E07-12/13).
[inputs.b]                         # K, channel-major: row c holds the n_tok keys of channel c (2 rows per channel at n_tok = 256)
shape = ["d", "n_tok"]

[inputs.a]                         # Q staged query-major: row i holds query i's d channels (gen.py transposes the old channel-major draw)
shape = ["n_tok", "d"]

[outputs.y]                             # S query-major: row (i, g) holds keys [g*128, g*128+128) -- RowMajor over n_tok keys
pack = "padded"                    # the row-major rows under the name attn_v's P takes, so a Chain hands the scores over in place
shape = ["n_tok", "n_tok"]
# ACTIVATE.EXACT, one row per store, in row order

[abi]
b = "CR2"        # K_BASE
a = "CR9"        # QROW_BASE
y = "CR3"        # S_BASE_G0
k_start_g0 = "CR5"
k_start_g1 = "CR6"
chan_start = "CR7"
chan_last = "CR8"
n_tok = "CR10"
k_stride = "CR11"
qf = "CR14"
# CR15 unbound -> default DS (CR15.L: valid_elements = 128), as the recorded cases ran

# The XMEM tables (ipu_harness.tables): how the program walks each region.
[tables]
b = { repetitions = 512, overhead_rows = 2 }
a = {}
y = {}

[golden]
op = "matmul"                          # y = a @ b in the logical shapes above (batched over the leading dim)
tolerance = { fp32 = "FP32_ORDER" }    # a short contraction (d terms); the old check: rtol=1e-4, atol=1e-3 vs Q.T @ K.

[cases.default]
n_tok = 256
d = 36
seed = 0x9C0
generator = "../gen.py:seeded_uniform_qk"
