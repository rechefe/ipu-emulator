# vector_tour: the Cycle Inspector's curated conformance program (E08-16,
# E07-26). One fixed 4 x 128 tour of the MULT, ACC and AaQ slots in NX8 (the
# hardware mode, ADR 0007); each case runs in one NX8 variant.
[kernel]
op = "vector_tour"
formats = ["e3", "e4", "e5", "dynamic"]

[params]
two = { type = "float", default = 2.0 }         # MULT constant: the NX8 constant layout

[derived]
slot1    = "128"                                # the second R_CYCLIC slot, in elements
lane     = "4"                                  # the R0 element used as a scalar (LR4)
last_row = "3"                                  # rows of a - 1: BLT.S reads LR1 from cycle start
qf       = "case_qf"                            # the case's QF half

# XMEM: a, w, c, mask from row 0 (rows 0-6), acc from row 8, relu after acc.
[inputs.a]
shape = [4, 128]
row = 0

[inputs.w]
shape = [128]

[inputs.c]
shape = [128]

[outputs.acc]                                   # three ACTIVATE.QUANTIZE identity stores
shape = [3, 128]
row = 8

[outputs.relu]                                  # ACTIVATE.QUANTIZE relu of the third vector
shape = [128]
row = 11

[scratch.mask]                                  # three 16-byte R_MASK slots
shape = [128]
bytes = "gen.py:mask_slots"
after = "c"

[abi]
a        = "CR2"
w        = "CR3"
c        = "CR4"
mask     = "CR5"
slot1    = "CR6"
acc      = "CR7"
relu     = { register = "CR7", offset = -3 }    # stored at acc + 3 (one row per store)
lane     = "CR8"
two      = "CR9"
last_row = "CR11"
qf       = "CR14"

[golden]
reference = "reference.py:reference"
tolerance = { nx8 = "EXACT" }                   # exact accumulators, quantized like the golden

# The old cases' data: default_rng(16), a then w then c.
[cases.default]
generator = "gen.py:seeded_steps"
formats = ["e4"]

[cases.e3]
generator = "gen.py:seeded_steps"
formats = ["e3"]

[cases.e4]
generator = "gen.py:seeded_steps"
formats = ["e4"]

[cases.e5]
generator = "gen.py:seeded_steps"
formats = ["e5"]

[cases.dynamic]
generator = "gen.py:seeded_steps"
formats = ["dynamic"]
