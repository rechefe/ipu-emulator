# fully_connected: y[s, :] = w @ x[s, :] for 10 samples of 128 inputs and 64
# outputs, in NX8 (ADR 0007): the E4, E5 and dynamic variants, FP32
# accumulation, each sample's outputs quantized to the case's QF at the store.
# The shapes are fixed by the program (the .asm header has the design notes).
[kernel]
op = "fully_connected"
formats = ["e4", "e5", "dynamic"]

[params]
samples      = { type = "int", choices = [10], default = 10 }   # the program's loop bound
in_features  = { type = "int", choices = [128], default = 128 } # one row of inputs
out_features = { type = "int", choices = [64], default = 64 }   # lanes of the accumulator used

[derived]
row_step      = "1"                  # LR0 (sample) and LR14 (weight row) step one row
element_step  = "1"                  # LR5 (input element) steps by one
y_stride      = "1"                  # one stored row per sample (ACTIVATE.QUANTIZE)
first_sample  = "0"                  # LR0's start
lr2_start     = "0"                  # LR2's start (the program never reads LR2)
weight_start  = "-1"                 # LR14's start, one step before weight row 0
element_start = "-1"                 # LR5's start, one step before element 0
last_element  = "in_features - 1"    # the element loop's exit (BNE)
cyclic_index  = "0"                  # LR15: R_CYCLIC index and mask shift
qf            = "case_qf"            # the case's QF half: the MULT's and the store's

# The regions sit where the old harness put them, at fixed byte
# addresses: x at 0x0, w at 0x20000, y at 0x40000 (a row is 128 bytes in NX8).
[inputs.x]
shape = ["samples", "in_features"]
row = 0
range = { nx8 = [-4, 4] }                         # gen.py:extremes: every element at an end

[inputs.w]
shape = ["out_features", "in_features"]          # logical: output-major, not transposed
pack = "transposed"                               # one row per input feature (../pack.py)
row = "131072 / row_bytes"                        # byte 0x20000
range = { nx8 = [-4, 4] }

[outputs.y]
shape = ["samples", "out_features"]
row = "262144 / row_bytes"                        # byte 0x40000

[abi]
x             = "CR0"                # pinned at row 0: the hardwired 0
y             = "CR2"
row_step      = "CR3"
element_step  = "CR4"
y_stride      = "CR5"
first_sample  = "CR6"
samples       = "CR7"
lr2_start     = "CR8"
weight_start  = "CR9"
element_start = "CR10"
last_element  = "CR11"
cyclic_index  = "CR12"
w             = "CR13"
qf            = "CR14"               # read as CR14.L

[golden]
# y = w @ x per sample, from the shared ops.linear (reference.py) on the inputs
# as NX8 holds them, quantized row by row as the store quantizes (ADR 0007).
# The products are exact in FP32, but the sum of 128 of them rounds in the
# kernel's order, not the reference's, which can move an output across a
# rounding edge of its row's grid: one NX8 step.
reference = "reference.py:reference"
tolerance = { nx8 = "NX8_STEP" }

# At most 128 * 16 = 2048 per sum: far inside FP32.
[cases.default]

[cases.extremes]                                  # every element at a range end
generator = "gen.py:extremes"

[cases.every_code]                                # every code of a row's grid, subnormals too
formats = ["e4", "e5"]                            # a dynamic row picks its fe from its data
generator = "gen.py:every_code"
