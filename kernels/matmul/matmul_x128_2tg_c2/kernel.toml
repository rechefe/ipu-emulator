# matmul_x128_2tg_c2: the single-stream transformer matmul y = act(a @ b) in FP32
# (E07-08): two token groups of 128, K in two chunks (128 + a tail). registry.toml fixes (m, k, n,
# activation) for its entries; run by itself it is its first entry's shape.
[kernel]
op = "matmul"
formats = ["fp32"]

[params]
m          = { type = "int", choices = [256] }                   # two token groups of 128
k          = { type = "int", min = 129, max = 256 }            # input channels: 2 chunks
n          = { type = "int", min = 1 }                        # output channels
activation = { type = "str", choices = ["none", "silu"], default = "none" }  # fused at the store

[derived]
n_tg       = "ceil(m / 128)"                           # token groups
n_tok      = "m / n_tg"                                # tokens per group: one row
chunks     = "ceil(k / 128)"                           # weight rows per output channel
w1         = "base(a) + 1"                             # weight chunk 1 (+1 row)
y_tg1      = "base(y) + n"                             # token group 1's output
d_start0   = "-n_tg"                                   # tg 0 data startup (rows)
d_start1   = "-1"                                      # tg 1 data startup (rows)
idx_start0 = "-1"                                      # k-loop 1 fixed_idx startup: first live k = 0
idx_start1 = "127"                                     # k-loop 2 fixed_idx startup: first live k = 128
tail_bound = "k - 2"                                   # k-loop 2 bound: 128 + (k - 128) - 2
d_stride   = "n_tg"                                    # data rows per input channel
bounds     = "halves(126, tail_bound)"                 # CR13: a 128-wide chunk's bound (low half) and the last chunk's (high half)
w_stride   = "chunks"                                  # weight rows per output channel
qf         = "case_qf"                                 # the case's QF half (0 in FP32, which ignores it)

# Placed from row 0: b, a, y (the old XMEM map).
[inputs.b]                                        # the data D = A^T, channel-major
shape = ["n_tg", "k", "n_tok"]
pack = "channel_major"
row = 0

[inputs.a]                                        # the weights W, output-major
shape = ["n", "k"]
pack = "output_major_weights"

[outputs.y]                                       # one row per (group, channel), n_tok lanes valid
shape = ["n_tg", "n", "n_tok"]

[abi]
b          = "CR0"
a          = "CR9"
w1         = "CR2"
y          = "CR3"
y_tg1      = "CR4"
d_start0   = "CR5"
d_start1   = "CR6"
idx_start0 = "CR7"
idx_start1 = "CR8"
d_stride   = "CR11"
bounds     = "CR13"
n          = "CR10"
w_stride   = "CR12"
qf         = "CR14"  # the MULT QF half: CR14.L

# The XMEM tables (ipu_harness.tables): how the program walks each region.
[tables]
b = { repetitions = "2 * n", overhead_rows = 2 }
a = { also_via = ["w1"] }
y = { repetitions = "n", also_via = ["y_tg1"] }

[golden]
op = "linear"                                    # activation(a @ b), ipu_kernels.reference.ops
tolerance = { fp32 = "FP32_LONG" }

# The old cases' data (../gen.py: RandomState(0), A then W).
[cases.default]
m = 256
k = 144
n = 144
generator = "../gen.py:seeded_uniform_channel_major"
