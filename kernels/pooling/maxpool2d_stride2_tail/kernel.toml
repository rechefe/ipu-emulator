# maxpool2d_stride2_tail: 2x2 stride-2 max-pool of [C, H, W], FP32, for a
# width whose final output XMEM row has one input XMEM row behind it
# (2 <= width mod 256 <= 128; E07-14). maxpool2d_stride2 takes the other
# widths. Was a whole-image kernel.
[kernel]
op = "maxpool2d"
formats = ["fp32"]

[params]
channels    = { type = "int", min = 1 }
height      = { type = "int", min = 2 }
width       = { type = "int", min = 2 }
kernel_size = { type = "int", choices = [2] }
stride      = { type = "int", choices = [2] }
padding     = { type = "int", choices = [0] }

[derived]
in_tiles   = "ceil(width / 128)"                         # IN_ROW_STRIDE
out_tiles  = "ceil((width // 2) / 128)"                  # OUT_TILES_PER_ROW
# 1 when the final output XMEM row has one input XMEM row, else no value (a
# division by zero): the shape grammar has no comparison.
tail_only  = "1 / max(0, 2 * out_tiles - in_tiles)"
row_step2  = "2 * in_tiles"                              # spatial row 2y to 2(y+1)
out_height = "height // 2"
lanes      = "128"                                       # R_CYCLIC slot-1 index
plane      = "height * in_tiles"                         # IN_PLANE_STRIDE (rows)
complete   = "out_tiles - 1"                             # full output XMEM rows before the tail

# Placed from row 0: x, y, stage (the old image: input, output, scratch).
[inputs.x]
shape = ["channels", "height", "width"]
pack = "halo_tiled"                                      # ../pack.py, no halo

[outputs.y]
shape = ["channels", "height // 2", "width // 2"]
pack = "tiled"                                           # ../pack.py

[scratch.stage]                                          # the decimation round trip
shape = [2, 128]

[abi]
x          = "CR2"
y          = "CR3"
stage      = "CR4"
in_tiles   = "CR5"
row_step2  = "CR6"
out_tiles  = "CR7"
out_height = "CR8"
channels   = "CR9"
lanes      = "CR10"
plane      = "CR11"
complete   = "CR12"

[golden]
op = "maxpool2d"
tolerance = { fp32 = "EXACT" }

# The legacy benchmark.py CONFIGS and MAX_CYCLES (bazel run
# :maxpool2d_stride2_tail -- --benchmark).
[benchmark]
points = [
    { channels = 1, height = 2, width = 260 },
    { channels = 64, height = 2, width = 260 },
    { channels = 1, height = 480, width = 640 },
    { channels = 64, height = 480, width = 640 },
]
max_cycles = 20_000_000

# The old cases' data (../gen.py: standard normal, seed 7).
[cases.default]
channels = 1
height = 4
width = 16
kernel_size = 2
stride = 2
padding = 0
generator = "../gen.py:legacy_normal"

[cases.tile_boundary]
channels = 2
height = 5
width = 260
kernel_size = 2
stride = 2
padding = 0
generator = "../gen.py:legacy_normal"
