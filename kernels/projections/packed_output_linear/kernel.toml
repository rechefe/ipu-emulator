# packed_output_linear: one packed output row of a projection, y = activation(a @ b),
# in the MobileViT packed layout at tokens = 16 (Layer 5): 8 output channels a
# call, side by side in one row (E07-23). A template: ../registry.toml fixes
# its activation for the packed_output_linear{,_silu}_240 entries; k is a case parameter
# (the QKV / OutProj / FFN1 width and FFN2's 4x).
[kernel]
op = "packed_linear"                       # not "projection": its tensors are in the packed layout
formats = ["fp32"]

[params]
k          = { type = "int", min = 8, multiple_of = 8 }    # the contraction length
activation = { type = "str", choices = ["none", "silu"], default = "none" }  # fused at the store

[derived]
tokens      = "16"
n_out       = "8"                          # 128 / tokens: one packed row
dstruct_mult = "dstructure(128, 8)"         # partition P8: one window per output channel
dstruct_row  = "dstructure(128)"
# R_CYCLIC index seeds, one per output channel p: (512 - tokens * (p + 1)) % 512
seed0 = "496"
seed1 = "480"
seed2 = "464"
seed3 = "448"
seed4 = "432"
seed5 = "416"
seed6 = "400"
seed7 = "384"

[inputs.a]                                  # the call's output-major weights
shape = ["n_out", "k"]
pack = "weight_chunks"                      # ../pack.py

[inputs.b]                                  # the (k, tokens) data as its packed rows
shape = ["k * tokens / 128", 128]

[outputs.y]                                 # (n_out, tokens) as one packed row
shape = [1, 128]

[scratch.mask]                              # R_MASK: each output channel's window in its slot
shape = [1, 128]
bytes = "../gen.py:window_mask"

[abi]
b            = "CR2"
a            = "CR3"
y            = "CR4"
mask         = "CR5"
dstruct_mult = "CR6"
dstruct_row  = "CR7"
seed0        = "CR8"
seed1        = "CR9"
seed2        = "CR10"
seed3        = "CR11"
seed4        = "CR12"
seed5        = "CR13"
seed6        = "CR14"
seed7        = "CR15"

[golden]
reference = "reference.py:reference"        # ops.linear on the packed rows
tolerance = { fp32 = { tier = "FP32_LONG", atol = 5e-5, why = "measured max|err| 2.9e-5 at k = 960 (ffn2), near-zero outputs of a long FP32 sum" } }

[cases.default]                             # QKV, OutProj and FFN1's width
k = 240

[cases.ffn2]                                # FFN2: k = 4 * 240
k = 960
