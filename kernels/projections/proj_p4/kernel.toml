# proj_p4: the one-token-group projection template (E07-02). registry.toml
# fixes its parameters for the 8 L4/L5 entries (proj_{qkv,outproj,ffn1,ffn2}_
# {192,240}_p4); run by itself it is a small shape of the same program.
[kernel]
op = "projection"
# E4 waits for the AaQ stage: ACTIVATE.QUANTIZE refuses an 8-bit float format
# (OQ-20). test_formats.py fails when that changes (E07-03).
formats = ["fp32", "int8"]

[params]
k          = { type = "int", min = 128, multiple_of = 16 }  # input channels; chunk 0 is a full 128
n_out      = { type = "int", min = 1 }                       # output channels
n_tok      = { type = "int", min = 1, max = 128 }            # tokens per group: one row
n_tg       = { type = "int", choices = [1], default = 1 }    # token groups
n_streams  = { type = "int", choices = [4], default = 4 }    # pixel-streams per invocation
activation = { type = "str", choices = ["none", "silu"], default = "none" }  # fused at the store

[derived]
rc_slot0        = "0"                              # LR1 start value: the R_CYCLIC slot-0 index the program reads
neg_one         = "-1"                             # data-pointer and fixed_idx startup
full_bound      = "126"                            # inner-loop bound of a 128-wide chunk
chunk_count     = "ceil(k / 128)"
w_stride        = "chunk_count"                    # weight rows per output channel
last_chunk_idx  = "chunk_count - 1"
tail_bound      = "k - 128 * (chunk_count - 1) - 2"  # the last chunk's width - 2
data_stream_str = "k * n_tg"                       # b rows per stream
out_stream_str  = "n_tg * n_out"                   # y rows per stream
stream_count    = "n_streams"

# Placed in this order from row 0: b, a, y (today's XMEM map).
[inputs.b]                                         # the data D, channel-major per stream
shape = ["n_streams", "n_tg", "k", "n_tok"]
pack = "channel_major"
range = { int8 = [-2, 2] }                         # INT8: < 1% of y saturates (test_formats.py)

[inputs.a]                                         # the shared weights W, output-major
shape = ["n_out", "k"]
pack = "output_major_weights"
range = { int8 = [-2, 2] }

[outputs.y]                                        # ST.AAQ rows, n_tok lanes valid
shape = ["n_streams", "n_tg", "n_out", "n_tok"]
pack = "projection_output"

[abi]
b               = "CR2"
a               = "CR3"
y               = "CR4"
neg_one         = "CR5"
full_bound      = "CR6"
tail_bound      = "CR7"
w_stride        = "CR8"
n_out           = "CR9"
chunk_count     = "CR10"
last_chunk_idx  = "CR11"
data_stream_str = "CR12"
out_stream_str  = "CR13"
stream_count    = "CR14"
rc_slot0        = "LR1"

[golden]
op = "linear"                                      # activation(a @ b), ipu_kernels.reference.ops
tolerance = { fp32 = "FP32_LONG", int8 = "INT8_LSB" }  # INT8 measured exact (E07-03)

# FP32: the data of the old cases, RandomState(0xC0FFEE), b per stream
# then a. INT8: the default generator, in each input's range.
[cases.default]
generator = "gen.py:seeded_uniform"
k = 192
n_out = 8
n_tok = 64
activation = "silu"

# Every output channel's weight row is distinct ((j+1)/100) and b is all ones,
# so a weight pointer stuck at channel 0 reads every channel as channel 0.
[cases.weight_rows]
tier = "nightly"
formats = ["fp32"]                                 # (j+1)/100 rounds to 0 in INT8
generator = "gen.py:weight_rows"
k = 192
n_out = 8
n_tok = 64
