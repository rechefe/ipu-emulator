# fold_32x32x144: the 32 x 32 x 144 tensor from its four stride-2 phases (E07-05),
# the inverse of unfold_32x32x144; MobileViT-S layer L3. One shape.
[kernel]
op = "fold"
formats = ["fp32"]

[params]
h = { type = "int", choices = [32], default = 32 }
w = { type = "int", choices = [32], default = 32 }
c = { type = "int", choices = [144], default = 144 }

[derived]
# Every LR the program reads starts at a value [abi] gives, so a run that
# follows another kernel on one model (a chain) starts as a fresh one does.
slot0      = "0"                       # LR start value: the R_CYCLIC slot 0
src_row    = "0"                       # LR start value: the source row offset within a phase
dst_row    = "0"                       # LR start value: the destination row offset
channel    = "0"                       # LR start value: the channel counter
tg         = "2"                      # rows per channel of a phase (256 tokens)
x1         = "base(x) + c * tg"        # the phases' bases: x is phase-major
x2         = "base(x) + 2 * c * tg"
x3         = "base(x) + 3 * c * tg"
# ACC.RESHAPE index tables, four little-endian bytes per CR (lane indices,
# not byte addresses: no unit = "bytes", L16).
src_lo     = "50462976"                # [0, 1, 2, 3]
src_hi     = "117835012"               # [4, 5, 6, 7]
dst_lo     = "100925952"               # [0, 2, 4, 6]
dst_hi     = "235670024"               # [8, 10, 12, 14]
src_stride = "2"                      # LR7: rows per channel of a phase
dst_stride = "1"                       # LR9

# Placed in this order from row 0: x, y, ones (the old map).
[inputs.x]                    # the phases (0,0), (0,1), (1,0), (1,1); lanes past the tokens NaN
shape = [4, "c", 256]
pack  = "phase_rows"

[outputs.y]                   # 8 stripe(s) of 4 spatial rows, one row per channel
shape = ["c", "h", "w"]
pack  = "stripes"

[scratch.ones]                # R_CYCLIC's pass-through multiplier row
shape = [1, 128]
fill  = 1.0

[abi]
src_lo     = "CR2"
src_hi     = "CR3"
dst_lo     = "CR4"
dst_hi     = "CR5"
ones       = "CR8"
x          = "CR9"
x1         = "CR10"
x2         = "CR11"
x3         = "CR12"
y          = "CR13"
src_stride = "LR7"
dst_stride = "LR9"
c          = "LR11"                    # the channel loop's bound
slot0      = "LR0"
src_row    = "LR6"
dst_row    = "LR8"
channel    = "LR10"

[golden]
op = "fold"
tolerance = { fp32 = "EXACT" }

# The old case data: the phases of RandomState(0x34)'s tensor (../gen.py).
[cases.default]
generator = "../gen.py:phases"
