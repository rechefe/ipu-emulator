# fold_8x8x240: the 8 x 8 x 240 tensor from its four stride-2 phases (E07-05),
# the inverse of unfold_8x8x240; MobileViT-S layer L5. One shape.
[kernel]
op = "fold"
formats = ["fp32"]

[params]
h = { type = "int", choices = [8], default = 8 }
w = { type = "int", choices = [8], default = 8 }
c = { type = "int", choices = [240], default = 240 }

[derived]
tg         = "1"                      # rows per channel of a phase (16 tokens)
phase_rows = "c * tg"                  # rows per stream: stream k is k * phase_rows on in x
# ACC.RESHAPE index tables, four little-endian bytes per CR (lane indices,
# not byte addresses: no unit = "bytes", L16).
src_lo     = "50462976"                # [0, 1, 2, 3]
src_hi     = "117835012"               # [4, 5, 6, 7]
dst_lo     = "100925952"               # [0, 2, 4, 6]
dst_hi     = "370414096"               # [16, 18, 20, 22]
qf         = "case_qf"                 # the case's QF half (0: FP32 ignores it)

# Placed in this order from row 0: x, y, ones (the old map).
[inputs.x]                    # the phases (0,0), (0,1), (1,0), (1,1); lanes past the tokens NaN
shape = [4, "c", 16]
pack  = "phase_rows"

[outputs.y]                   # 1 stripe(s) of 8 spatial rows, one row per channel
shape = ["c", "h", "w"]
pack  = "stripes"

[scratch.ones]                # R_CYCLIC's pass-through multiplier row
shape = [1, 128]
fill  = 1.0

[abi]
src_lo     = "CR2"
src_hi     = "CR3"
dst_lo     = "CR4"
dst_hi     = "CR5"
ones       = "CR8"
x          = "CR9"
phase_rows = "CR10"
y          = "CR13"
c          = "CR6"                     # the channel loop's bound
qf         = "CR14"

# The XMEM tables (ipu_harness.tables): how the program walks each region.
[tables]
x = { repetitions = 241 }
y = {}
ones = {}

[golden]
op = "fold"
tolerance = { fp32 = "EXACT" }

# The old case data: the phases of RandomState(0x5a)'s tensor (../gen.py).
[cases.default]
generator = "../gen.py:phases"
