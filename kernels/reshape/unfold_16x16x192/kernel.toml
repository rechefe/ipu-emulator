# unfold_16x16x192: the four stride-2 phases of a 16 x 16 x 192 tensor (E07-05), MobileViT-S
# layer L4. One shape: the program's loops and
# ACC.STRIDE slots are written for it.
[kernel]
op = "unfold"
formats = ["fp32"]

[params]
h = { type = "int", choices = [16], default = 16 }
w = { type = "int", choices = [16], default = 16 }
c = { type = "int", choices = [192], default = 192 }

[derived]
tg       = "1"                       # rows per channel of a phase (64 tokens)
phase_rows = "c * tg"                 # rows per stream: stream k is k * phase_rows on in y
qf       = "case_qf"                     # the case's QF half (0: FP32 ignores it)

[inputs.x]                    # 2 stripe(s) of 8 spatial rows, one row per channel
shape = ["c", "h", "w"]
pack  = "stripes"
row   = 0                     # stripe 0 is read through CR0 (hardwired 0)

[outputs.y]                   # the phases (0,0), (0,1), (1,0), (1,1), one after another
shape = [4, "c", 64]
pack  = "phase_rows"

[scratch.ones]                # R_CYCLIC's pass-through multiplier row
shape = [1, 128]
fill  = 1.0
after = "x"                   # between x and y, as the old map

[abi]
x        = "CR0"
ones     = "CR8"
y        = "CR9"
phase_rows = "CR10"
c        = "CR7"            # the channel loop's bound
qf       = "CR14"

# The XMEM tables (ipu_harness.tables): how the program walks each region.
[tables]
x = { repetitions = 769 }
y = { repetitions = 192 }
ones = {}

[golden]
op = "unfold"
tolerance = { fp32 = "EXACT" }

# The old case data: RandomState(0x16), uniform [-1, 1) (../gen.py).
[cases.default]
generator = "../gen.py:spatial"
