# unfold_32x32x144: the four stride-2 phases of a 32 x 32 x 144 tensor (E07-05), MobileViT-S
# layer L3. One shape: the program's loops and
# ACC.STRIDE slots are written for it.
[kernel]
op = "unfold"
formats = ["fp32"]

[params]
h = { type = "int", choices = [32], default = 32 }
w = { type = "int", choices = [32], default = 32 }
c = { type = "int", choices = [144], default = 144 }

[derived]
# Every LR the program reads starts at a value [abi] gives, so a run that
# follows another kernel on one model (a chain) starts as a fresh one does.
slot0      = "0"                       # LR start value: the R_CYCLIC slot 0, mask shift, ACC.STRIDE slot 0
src_row    = "0"                       # LR start value: the source row offset
dst_row    = "0"                       # LR start value: the destination row offset
channel    = "0"                       # LR start value: the channel counter
tg       = "2"                       # rows per channel of a phase (256 tokens)
y1       = "base(y) + c * tg"         # the phases' bases: y is phase-major
y2       = "base(y) + 2 * c * tg"
y3       = "base(y) + 3 * c * tg"
stripe1  = "base(x) + c"              # stripe s of x at base(x) + s * c
stripe2  = "base(x) + 2 * c"
stripe3  = "base(x) + 3 * c"
stripe4  = "base(x) + 4 * c"
stripe5  = "base(x) + 5 * c"
stripe6  = "base(x) + 6 * c"
stripe7  = "base(x) + 7 * c"
slot1    = "1"
slot2    = "2"
slot3    = "3"
src_stride = "1"
dst_stride = "2"
tg1_offset = "1"
qf       = "case_qf"                     # the case's QF half (0: FP32 ignores it)

[inputs.x]                    # 8 stripe(s) of 4 spatial rows, one row per channel
shape = ["c", "h", "w"]
pack  = "stripes"
row   = 0                     # stripe 0 is read through CR0 (hardwired 0)

[outputs.y]                   # the phases (0,0), (0,1), (1,0), (1,1), one after another
shape = [4, "c", 256]
pack  = "phase_rows"

[scratch.ones]                # R_CYCLIC's pass-through multiplier row
shape = [1, 128]
fill  = 1.0
after = "x"                   # between x and y, as the old map

[abi]
x        = "CR0"
ones     = "CR8"
y        = "CR9"
y1       = "CR10"
y2       = "CR11"
y3       = "CR12"
stripe1  = "CR13"
stripe2  = "CR2"
stripe3  = "CR3"
stripe4  = "CR4"
stripe5  = "CR5"
stripe6  = "CR6"
stripe7  = "CR7"
slot1    = "LR1"
slot2    = "LR2"
slot3    = "LR3"
src_stride = "LR5"
dst_stride = "LR6"
tg1_offset = "LR9"
c        = "LR11"               # the channel loop's bound
slot0      = "LR0"
src_row    = "LR4"
dst_row    = "LR8"
channel    = "LR10"
qf       = "CR14"

[golden]
op = "unfold"
tolerance = { fp32 = "EXACT" }

# The old case data: RandomState(0x32), uniform [-1, 1) (../gen.py).
[cases.default]
generator = "../gen.py:spatial"
