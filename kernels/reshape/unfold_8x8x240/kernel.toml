# unfold_8x8x240: the four stride-2 phases of a 8 x 8 x 240 tensor (E07-05), MobileViT-S
# layer L5. One shape: the program's loops and
# ACC.STRIDE slots are written for it.
[kernel]
op = "unfold"
formats = ["fp32"]

[params]
h = { type = "int", choices = [8], default = 8 }
w = { type = "int", choices = [8], default = 8 }
c = { type = "int", choices = [240], default = 240 }
pad = { type = "float", default = 0.0 }   # x's lanes 64..127 (paired_rows): test data only

[derived]
tg       = "1"                       # rows per channel of a phase (16 tokens)
phase_rows = "c * tg"                 # rows per stream: stream k is k * phase_rows on in y
qf         = "case_qf"                     # the case's QF half (0: FP32 ignores it)

[inputs.x]                    # 1 stripe(s) of 8 spatial rows, one row per channel
shape = ["c", "h", "w"]
pack  = "paired_rows"

[outputs.y]                   # the phases (0,0), (0,1), (1,0), (1,1), one after another
shape = [4, "c", 16]
pack  = "phase_rows"

[scratch.ones]                # R_CYCLIC's pass-through multiplier row
shape = [1, 128]
fill  = 1.0
after = "x"                   # between x and y, as the old map

[abi]
x        = "CR2"
ones     = "CR8"
y        = "CR9"
phase_rows = "CR10"
c        = "CR7"            # the channel loop's bound
qf       = "CR14"

# The XMEM tables (ipu_harness.tables): how the program walks each region.
[tables]
x = { overhead_rows = 1 }
y = { repetitions = 240 }
ones = {}

[golden]
op = "unfold"
tolerance = { fp32 = "EXACT" }

# The old case data: RandomState(0x58), uniform [-1, 1) (../gen.py).
[cases.default]
generator = "../gen.py:spatial"

# The padding lanes (64..127) of x's rows never reach the phases.
[cases.garbage_padding]
generator = "../gen.py:spatial"
pad = 1000.0
