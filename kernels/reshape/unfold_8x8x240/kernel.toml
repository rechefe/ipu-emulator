# unfold_8x8x240: the four stride-2 phases of a 8 x 8 x 240 tensor (E07-05), MobileViT-S
# layer L5. One shape: the program's loops and
# ACC.STRIDE slots are written for it.
[kernel]
op = "unfold"
formats = ["fp32"]

[params]
h = { type = "int", choices = [8], default = 8 }
w = { type = "int", choices = [8], default = 8 }
c = { type = "int", choices = [240], default = 240 }
pad = { type = "float", default = 0.0 }   # x's lanes 64..127 (paired_rows): test data only

[derived]
# Every LR the program reads starts at a value [abi] gives, so a run that
# follows another kernel on one model (a chain) starts as a fresh one does.
slot0      = "0"                       # LR start value: the R_CYCLIC slot 0, mask shift, ACC.STRIDE slot 0
src_row    = "0"                       # LR start value: the source row offset
dst_row    = "0"                       # LR start value: the destination row offset
channel    = "0"                       # LR start value: the channel counter
tg       = "1"                       # rows per channel of a phase (16 tokens)
y1       = "base(y) + c * tg"         # the phases' bases: y is phase-major
y2       = "base(y) + 2 * c * tg"
y3       = "base(y) + 3 * c * tg"
src_stride = "1"
dst_stride = "1"

[inputs.x]                    # 1 stripe(s) of 8 spatial rows, one row per channel
shape = ["c", "h", "w"]
pack  = "paired_rows"
row   = 0                     # stripe 0 is read through CR0 (hardwired 0)

[outputs.y]                   # the phases (0,0), (0,1), (1,0), (1,1), one after another
shape = [4, "c", 16]
pack  = "phase_rows"

[scratch.ones]                # R_CYCLIC's pass-through multiplier row
shape = [1, 128]
fill  = 1.0
after = "x"                   # between x and y, as the old map

[abi]
x        = "CR0"
ones     = "CR8"
y        = "CR9"
y1       = "CR10"
y2       = "CR11"
y3       = "CR12"
src_stride = "LR5"
dst_stride = "LR6"
c        = "LR11"               # the channel loop's bound
slot0      = "LR0"
src_row    = "LR4"
dst_row    = "LR8"
channel    = "LR10"

[golden]
op = "unfold"
tolerance = { fp32 = "EXACT" }

# The old case data: RandomState(0x58), uniform [-1, 1) (../gen.py).
[cases.default]
generator = "../gen.py:spatial"

# The padding lanes (64..127) of x's rows never reach the phases.
[cases.garbage_padding]
generator = "../gen.py:spatial"
pad = 1000.0
