# softmax_columns_packed: column softmax of a (rows, width) FP32 matrix with
# width <= 64, slot-packed: each row sits in a gw-lane slot (gw = the next power
# of two of width, at least 16), rpv = 128 / gw rows per XMEM row, every
# padding element NEG_PAD (-1e30). A cross-group fold then combines the rpv
# column partials of each lane (the .asm header has the passes).
[kernel]
op = "softmax"
formats = ["fp32"]                                   # exp2/reciprocal on the FP32 vector path only; NEG_PAD is an FP32 value
cost = 0

[params]
rows  = { type = "int", min = 1 }
width = { type = "int", min = 1, max = 64 }          # at 65 a slot is a whole row: softmax_columns
dim   = { type = "int", choices = [0], default = 0 } # down each column
scale = { type = "float", default = 5.0 }            # the generator's: x = randn * scale
seed  = { type = "int", default = 0 }                # the generator's

[derived]
# gw = partition_size(width): the next power of two >= width in 16..128 (the
# grammar has no log2, so a sum of steps).
gw          = "16 + 16 * min(1, max(0, width - 16)) + 32 * min(1, max(0, width - 32)) + 64 * min(1, max(0, width - 64))"
rpv         = "128 / gw"                             # rows per XMEM row: the fold's step count
device_rows = "ceil(rows * gw / 128)"                # XMEM rows, the last filled up with padding slots
step        = "128 * ceil(device_rows / 128)"
row_stride  = "1"                                    # one XMEM row per vector
dup_index   = "128"                                  # the fold's duplicate-load element index
qf          = "case_qf"                              # the case's QF half (0: FP32 ignores it)

# The regions sit where the old harness put them: from row 128, the
# input, the numerators and the output back to back, each rounded up to a
# multiple of 128 rows (step), then the resident rows. Every region is pinned:
# first fit in declaration order would put y right after x.
[inputs.x]                                           # gw-lane slots, NEG_PAD padding (ipu_kernels.softmax.pack)
shape = ["rows", "width"]
pack = "col_slots_negpad"
row = 128

[outputs.y]
shape = ["rows", "width"]
pack = "col_slots_negpad"
row = "128 + 2 * step"

[scratch.num]                                        # numerators 2^(c * (x - max))
shape = ["device_rows", 128]
row = "128 + step"

# C_VEC (c = log2(e) in every lane), then the keep row (1.0 on each slot's
# width real columns, 0.0 on its padding), which the .asm reads as C_VEC's row
# + 1 through no register of its own: one 2-row region.
[scratch.log2e]
shape = [2, 128]
bytes = "../scratch.py:log2e_keep"
row = "128 + 3 * step"

[scratch.max]                                        # each lane's column max
shape = [1, 128]
row = "128 + 3 * step + 2"

[scratch.rvec]                                       # each lane's 1 / sum
shape = [1, 128]
row = "128 + 3 * step + 3"

[scratch.fold]                                       # the fold's scratch row
shape = [1, 128]
row = "128 + 3 * step + 4"

[abi]
y           = "CR2"
log2e       = "CR3"
num         = "CR4"
max         = "CR5"
rvec        = "CR6"
row_stride  = "CR7"
dup_index   = "CR9"
x           = "CR10"
device_rows = "CR11"
fold        = "CR12"
gw          = "CR13"
rpv         = "CR14"
qf          = "CR8"
# CR15.L: the default DS (128 valid elements).

[golden]
op = "softmax"
tolerance = { fp32 = "TRANSCENDENT" }

# The old cases' data (gen.py:seeded_normal: the old seeds).
[cases.default]
rows = 64
width = 16
scale = 3.0
seed = 0
generator = "../gen.py:seeded_normal"

# The output reads back in the input's (rows, width) layout (the old family
# layout test: seed = rows + width): width not a power of two and rows not a
# multiple of rpv; no padding at all.
[cases.layout_pad]
rows = 10
width = 20
scale = 3.0
seed = 30
generator = "../gen.py:seeded_normal"

[cases.layout_exact]
rows = 8
width = 32
scale = 3.0
seed = 40
generator = "../gen.py:seeded_normal"

# The old sweep, one case per point: a one-element list puts the old case
# id in the case's name (sweep_01[rows=16,width=64,scale=3.0,seed=0]).
[cases.sweep_01]  # 2 rows/vec, clean width
rows = [16]
width = [64]
scale = [3.0]
seed = [0]
generator = "../gen.py:seeded_normal"

[cases.sweep_02]  # 4 rows/vec
rows = [64]
width = [32]
scale = [4.0]
seed = [1]
generator = "../gen.py:seeded_normal"

[cases.sweep_03]  # 8 rows/vec, rows not a multiple of rpv (tail)
rows = [100]
width = [16]
scale = [3.0]
seed = [2]
generator = "../gen.py:seeded_normal"

[cases.sweep_04]  # 8 rows/vec, 33 rows -> 5 vectors (tail of 1)
rows = [33]
width = [16]
scale = [5.0]
seed = [3]
generator = "../gen.py:seeded_normal"

[cases.sweep_05]  # width 33 -> pad to 64 (intra-group padding)
rows = [16]
width = [33]
scale = [3.0]
seed = [4]
generator = "../gen.py:seeded_normal"

[cases.sweep_06]  # width 20 -> pad to 32
rows = [32]
width = [20]
scale = [4.0]
seed = [5]
generator = "../gen.py:seeded_normal"

[cases.sweep_07]  # width 15 -> pad to 16, large |x| (stability)
rows = [16]
width = [15]
scale = [50.0]
seed = [6]
generator = "../gen.py:seeded_normal"

[cases.sweep_08]  # width 10 -> pad to 16, near-uniform
rows = [8]
width = [10]
scale = [0.01]
seed = [7]
generator = "../gen.py:seeded_normal"

[cases.sweep_09]  # single row -> softmax all 1.0
rows = [1]
width = [64]
scale = [3.0]
seed = [8]
generator = "../gen.py:seeded_normal"

# The old benchmark configs (bazel run //kernels/softmax/softmax_columns_packed -- --benchmark).
[benchmark]
points = [{ rows = 64, width = 8 }, { rows = 64, width = 16 }, { rows = 100, width = 32 }, { rows = 128, width = 64 }]
per = "rows"
