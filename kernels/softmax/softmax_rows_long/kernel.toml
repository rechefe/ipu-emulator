# softmax_rows_long: row softmax of a (rows, n) FP32 matrix with n > 128. Each
# row spans cpr = ceil(n / 128) XMEM rows: full_chunks whole chunks and a tail
# chunk of n % 128 elements (none when 128 divides n). Rows run in groups of
# up to 128 (the .asm header has the passes).
[kernel]
op = "softmax"
formats = ["fp32"]                                   # exp2/reciprocal on the FP32 vector path only
cost = 1

[params]
rows  = { type = "int", min = 1 }
n     = { type = "int", min = 129 }                  # a row of n <= 128 fits one chunk: the other row kernels
dim   = { type = "int", choices = [1], default = 1 } # along each row
scale = { type = "float", default = 5.0 }            # the generator's: x = randn * scale
seed  = { type = "int", default = 0 }                # the generator's

[derived]
cpr               = "ceil(n / 128)"                  # chunks per row
full_chunks       = "n // 128"
device_rows       = "rows * cpr"
step              = "128 * ceil(device_rows / 128)"
row_stride        = "1"                              # one XMEM row per chunk
tail              = "ds(n % 128)"                    # the tail block's DS: 0 valid elements makes it a no-op
group_cap         = "128"                            # maxvec's R1 index base
row_stride_chunks = "cpr"                            # XMEM rows per matrix row (a second name: one register each)
ds_qf             = "halves(ds(128), case_qf)"       # LOW: the full-chunk DS (the default CR15); HIGH: the case's QF

# The regions sit where the old harness put them: from row 128, the
# input, the numerators and the output back to back, each rounded up to a
# multiple of 128 rows (step), then the resident rows. Every region is pinned:
# first fit in declaration order would put y right after x.
[inputs.x]                                           # cpr rows per row, the tail chunk zero-padded
shape = ["rows", "n"]
row = 128

[outputs.y]
shape = ["rows", "n"]
row = "128 + 2 * step"

[scratch.num]                                        # numerators 2^(c * (x - max))
shape = ["device_rows", 128]
row = "128 + step"

[scratch.log2e]                                      # C_VEC: c = log2(e) in every lane
shape = [1, 128]
fill = 1.4426950408889634
row = "128 + 3 * step"

[scratch.max]                                        # maxvec: one row max per lane
shape = [1, 128]
row = "128 + 3 * step + 1"

[scratch.rvec]                                       # 1 / sum: one per lane
shape = [1, 128]
row = "128 + 3 * step + 2"

[abi]
y                 = "CR2"
log2e             = "CR3"
num               = "CR4"
max               = "CR5"
rvec              = "CR6"
row_stride        = "CR7"
tail              = "CR8"
group_cap         = "CR9"
x                 = "CR10"
rows              = "CR11"
full_chunks       = "CR12"
cpr               = "CR13"
row_stride_chunks = "CR14"
ds_qf             = "CR15"

[golden]
op = "softmax"
tolerance = { fp32 = "TRANSCENDENT" }

# The old cases' data (gen.py:seeded_normal: the old seeds).
[cases.default]
rows = 8
n = 300
scale = 5.0
seed = 0
generator = "../gen.py:seeded_normal"

# The output reads back in the input's (rows, n) layout (the old family layout
# test: seed = rows + n), with a tail chunk and without one.
[cases.layout_tail]
rows = 5
n = 300
scale = 3.0
seed = 305
generator = "../gen.py:seeded_normal"

[cases.layout_exact]
rows = 3
n = 256
scale = 3.0
seed = 259
generator = "../gen.py:seeded_normal"

# The old sweep, one case per point: a one-element list puts the old case
# id in the case's name (sweep_01[rows=1,n=129,scale=3.0,seed=0]).
[cases.sweep_01]  # smallest long row: 1 full chunk + 1 tail
rows = [1]
n = [129]
scale = [3.0]
seed = [0]
generator = "../gen.py:seeded_normal"

[cases.sweep_02]  # 1 full + 72 tail
rows = [4]
n = [200]
scale = [4.0]
seed = [1]
generator = "../gen.py:seeded_normal"

[cases.sweep_03]  # 2 full + 1 tail
rows = [8]
n = [257]
scale = [3.0]
seed = [2]
generator = "../gen.py:seeded_normal"

[cases.sweep_04]  # 2 full + 44 tail
rows = [8]
n = [300]
scale = [5.0]
seed = [3]
generator = "../gen.py:seeded_normal"

[cases.sweep_05]  # numerical stability (large |x|)
rows = [16]
n = [130]
scale = [50.0]
seed = [4]
generator = "../gen.py:seeded_normal"

[cases.sweep_06]  # near-uniform
rows = [8]
n = [300]
scale = [0.01]
seed = [5]
generator = "../gen.py:seeded_normal"

[cases.sweep_07]  # 3 full + 17 tail
rows = [32]
n = [401]
scale = [3.0]
seed = [6]
generator = "../gen.py:seeded_normal"

[cases.sweep_08]  # max rows in one group
rows = [128]
n = [129]
scale = [4.0]
seed = [7]
generator = "../gen.py:seeded_normal"

# n % 128 == 0: exactly full_chunks whole chunks, NO tail chunk. The tail
# block still executes with valid_elements=0 (CR8), which makes its running
# AGG.MAX/AGG.SUM exact no-ops -- so the same kernel covers this shape.
[cases.sweep_09]  # 2 full chunks, no tail
rows = [6]
n = [256]
scale = [5.0]
seed = [8]
generator = "../gen.py:seeded_normal"

[cases.sweep_10]  # 3 full chunks, no tail
rows = [6]
n = [384]
scale = [5.0]
seed = [9]
generator = "../gen.py:seeded_normal"

[cases.sweep_11]  # 4 full chunks, no tail
rows = [4]
n = [512]
scale = [3.0]
seed = [10]
generator = "../gen.py:seeded_normal"

[cases.sweep_12]  # 8 full chunks, no tail
rows = [2]
n = [1024]
scale = [4.0]
seed = [11]
generator = "../gen.py:seeded_normal"

# >128 rows: maxvec/rvec hold one slot per row in a single 128-element vector,
# so the kernel runs groups of <=128 rows (all four passes per group). Row
# indices restart each group, which is what keeps them out of the R1 range
# that MULT.RC.VE's `src` would otherwise select. See the .asm group loop.
[cases.sweep_13]  # one row past a full group
rows = [129]
n = [129]
scale = [3.0]
seed = [12]
generator = "../gen.py:seeded_normal"

[cases.sweep_14]
rows = [200]
n = [200]
scale = [4.0]
seed = [13]
generator = "../gen.py:seeded_normal"

[cases.sweep_15]  # exactly two full groups
rows = [256]
n = [130]
scale = [3.0]
seed = [14]
generator = "../gen.py:seeded_normal"

[cases.sweep_16]  # two full groups + a short one
rows = [300]
n = [129]
scale = [5.0]
seed = [15]
generator = "../gen.py:seeded_normal"

# The old benchmark configs (bazel run //kernels/softmax/softmax_rows_long -- --benchmark).
[benchmark]
points = [{ rows = 8, n = 200 }, { rows = 8, n = 300 }, { rows = 16, n = 500 }, { rows = 4, n = 1000 }, { rows = 200, n = 200 }, { rows = 300, n = 129 }]
per = "rows"
