# softmax_rows_partial: row softmax of a (rows, n) FP32 matrix with n <= 128,
# slot-packed: each row sits in a ps-lane slot (ps = the next power of two of
# n, at least 16), P = 128 / ps rows per XMEM row. Rows run in groups of up to
# 128 (the .asm header has the passes). At n = 128 (P = 1) softmax_rows is
# cheaper, so the cost is 2 there and 1 below.
[kernel]
op = "softmax"
formats = ["fp32"]                                   # exp2/reciprocal on the FP32 vector path only
cost = "1 + min(1, max(0, n - 127))"

[params]
rows  = { type = "int", min = 1 }
n     = { type = "int", min = 1, max = 128 }
dim   = { type = "int", choices = [1], default = 1 } # along each row
scale = { type = "float", default = 5.0 }            # the generator's: x = randn * scale
seed  = { type = "int", default = 0 }                # the generator's

# The regions sit where the old harness put them: from row 128, the
# input, the numerators and the output back to back, each rounded up to a
# multiple of 128 rows (step), then the resident rows. Every region is pinned:
# first fit in declaration order would put y right after x.
[inputs.x]                                           # ps-lane slots, 0.0 padding (ipu_kernels.softmax.pack)
shape = ["rows", "n"]
pack = "row_slots"
row = 128

[outputs.y]
shape = ["rows", "n"]
pack = "row_slots"
row = "128 + 2 * step"

[scratch.num]                                        # numerators 2^(c * (x - max))
shape = ["device_rows", 128]
row = "128 + step"

[scratch.log2e]                                      # C_VEC: c = log2(e) in every lane
shape = [1, 128]
fill = 1.4426950408889634
row = "128 + 3 * step"

[scratch.max]                                        # maxvec: one row max per lane
shape = [1, 128]
row = "128 + 3 * step + 1"

# rvec (1 / sum, one per lane), then the Pass-4 R_MASK image, which the .asm
# reads as rvec's row + 1 through no register of its own: one 2-row region.
[scratch.rvec]
shape = [2, 128]
bytes = "../scratch.py:rvec_mask"
row = "128 + 3 * step + 2"

[derived]
# ps = partition_size(n): the next power of two >= n in 16..128 (the grammar
# has no log2, so a sum of steps).
ps           = "16 + 16 * min(1, max(0, n - 16)) + 32 * min(1, max(0, n - 32)) + 64 * min(1, max(0, n - 64))"
parts        = "128 / ps"                            # P: rows per XMEM row
device_rows  = "ceil(rows * ps / 128)"               # XMEM rows, the last filled up with padding slots
step         = "128 * ceil(device_rows / 128)"
row_stride   = "1"                                   # one XMEM row per chunk
maxvec_base  = "dstructure(128)"                     # maxvec's R1 index base, and the full-row dstructure
ring         = "512"                                 # r_cyclic's ring, in elements
group_chunks = "ps"                                  # chunks in a full group: 128 / P = ps (one register per name)
dstruct      = "dstructure(n)"                       # every AGG and ACTIVATE sees the first n elements

[abi]
y            = "CR2"
log2e        = "CR3"
num          = "CR4"
max          = "CR5"
rvec         = "CR6"
row_stride   = "CR7"
maxvec_base  = "CR8"
device_rows  = "CR9"
x            = "CR10"
ring         = "CR11"
ps           = "CR12"
group_chunks = "CR13"
parts        = "CR14"
dstruct      = "CR15"

[golden]
op = "softmax"
tolerance = { fp32 = "TRANSCENDENT" }

# The old cases' data (gen.py:legacy_randn: the old seeds).
[cases.default]
n = 32
rows = 8
seed = 0
scale = 5.0
generator = "../gen.py:legacy_randn"

# The output reads back in the input's (rows, n) layout (the old family layout
# test: seed = rows + n): n < ps and rows not a multiple of P, both padding
# kinds at once; no padding at all; P = 8.
[cases.layout_pad]
n = 20
rows = 10
seed = 30
scale = 3.0
generator = "../gen.py:legacy_randn"

[cases.layout_exact]
