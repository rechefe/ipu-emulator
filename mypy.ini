# Shared mypy settings for every mypy_test (tools/typecheck.bzl, E01-11).
# Strictness is per target (`mypy_test(..., strict = True)`), never global.
[mypy]
python_version = 3.10
warn_unused_configs = True
namespace_packages = True
explicit_package_bases = True

# PyTorch is a test-only dependency (Q74b, E06-09): ipu_harness.reference imports
# it inside evaluate(), and no library target depends on it, so mypy has no stubs.
[mypy-torch,torch.*]
ignore_missing_imports = True
