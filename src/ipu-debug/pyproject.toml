[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipu-debug"
version = "0.1.0"
description = "The IPU emulator's interactive debugger (a curses TUI)"
requires-python = ">=3.10"
dependencies = [
    "ipu-emu",
    "ipu-isa",
]

[tool.uv.sources]
ipu-emu = { path = "../ipu-emu", editable = true }
ipu-isa = { path = "../ipu-isa", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv]
package = true
