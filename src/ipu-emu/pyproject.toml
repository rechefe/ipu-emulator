[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipu-emu"
version = "0.1.0"
description = "IPU cycle-functional emulator in Python"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "ipu-isa",
]

[tool.uv.sources]
ipu-as = { path = "../ipu-as", editable = true }
ipu-isa = { path = "../ipu-isa", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    # The tests assemble their programs; the emulator never imports the assembler.
    "ipu-as",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.uv]
package = true
