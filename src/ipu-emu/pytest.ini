[pytest]
testpaths = test
# Listed in order of increasing priority: the last matching entry wins.
filterwarnings =
    # The assembler flags debug-only slots at assemble time (none today:
    # ADR 0007 removed ACC_STORE); tests would run them freely.
    ignore:.* uses the simulation-only .* slot:UserWarning
    # A [DEBUG ONLY] run-time warning must be asserted with pytest.warns.
    error:\[DEBUG ONLY\]:UserWarning
    error::DeprecationWarning:ipu_emu
