# A fixture family for ipu_kernel_family() (E06-17): three shape variants of
# one template. `bazel test //src/ipu-harness/test/scales:scale_r2` runs
# the template's cases with rows = 2.
[[kernel]]
name = "scale_r2"
template = "scale_rows"
params = { rows = 2 }
doc = "Two rows, every format"

[[kernel]]
name = "scale_r8_fp32"
template = "scale_rows"
params = { rows = 8 }
formats = ["fp32"]
cases = ["default"]
doc = "Eight rows, FP32 only, the default case only"

[[kernel]]
name = "scale_r3_half"
template = "scale_rows"
params = { rows = 3, s = 0.5 }
formats = ["fp32", "e4"]
