# The template of the fixture family (E06-17): //kernels/elementwise/scale
# without user data, so an entry may fix rows to any value.
[kernel]
op = "scale_rows"
formats = ["fp32", "e4"]

[params]
rows = { type = "int", min = 1, max = 256 }
s    = { type = "float" }

[inputs.x]
shape = ["rows", 128]

[outputs.y]
shape = ["rows", 128]

[derived]
qf = "case_qf"                                     # the case's QF half (0 in FP32)

[abi]
x    = "CR2"
y    = "CR3"
rows = "CR4"
s    = "CR5"
qf   = "CR6"

[golden]
reference = "reference.py:reference"
tolerance = { fp32 = "EXACT", e4 = "EXACT" }      # y is quantized like its golden

[cases.default]
rows = 4
s = 2.0

[cases.negative]
rows = 1
s = -3.0
