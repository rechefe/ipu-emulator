[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipu-isa"
version = "0.1.0"
description = "The IPU instruction set definitions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
ipu_isa = ["schemas/*.json"]

[tool.uv]
package = true
