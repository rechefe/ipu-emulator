# Measured with DRAMsim3 on HBM2_8Gb_x128.ini: IPU cycles (1.0 ns each) to move
# N consecutive 128-byte rows in one transfer. Generated by `memsim dram-measure`.
[model]
kind = "cache_unit"
num_banks = 16
bank_rows = 1024

[dram]
kind = "table"
fill = { "16" = 95, "64" = 191, "256" = 575, "1024" = 2111, "4096" = 8379 }
drain = { "16" = 34, "64" = 130, "256" = 514, "1024" = 2050, "4096" = 8344 }
