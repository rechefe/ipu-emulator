# Stage 11: the fill-time sweep again, finer where the first one was coarse:
# 1,000 to 2,111 (normalization), 2,111 to 4,000 (reshape), 4,000 to 8,000
# (depthwise and attention). 2 MB / 16 banks, as experiments/fill_time_2mb.toml.
name = "fill_time_fine"

[workload]
kind = "network"
network = "src/ipu-memsim/networks/mobilevit_s.toml"
layer_types = ["depthwise_conv", "attention", "normalization", "reshape"]

[model]
kind = "cache_unit"

[fixed]
xmem_mb = 2

[[sweep]]
param = "fill_cycles_per_bank"
values = [1000, 1200, 1400, 1500, 1600, 1800, 2111, 2500, 2800, 3000, 3200, 3500, 4000, 4500, 4750, 5000, 5250, 5500, 6000, 6500, 7000, 8000]

[report]
threshold_percent = 10
