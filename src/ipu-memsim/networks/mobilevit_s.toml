# ---- layer types MobileViT-S has and no kernel on master computes --------------
[[missing]]
type = "global_average_pool"
note = "no pooling kernel reduces a whole feature map to one vector (only maxpool2d kernels exist)"

[[missing]]
type = "classifier (fully connected 640->1000)"
note = "linear/fully_connected is fixed at 10 samples x 128 -> 64"

[[missing]]
type = "standard_conv stride 2, general"
note = "conv_first_layer covers only the 3->16 stem; conv_universal is stride 1"

[[missing]]
type = "SiLU after a convolution"
note = "the convolution kernels offer ReLU only (apply_relu); SiLU exists in the projection kernels"

[[missing]]
type = "batch normalization as its own layer"
note = "folded into the convolution's bias (the *_bn_activation kernels); nothing to measure separately"
