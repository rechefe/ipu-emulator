# MobileViT-S, as the kernels in this repository cover it.
#
# Where the shapes come from:
# - Transformer layers (attention, MLP, normalization, elementwise, reshape):
#   docs/content/kernels/mobilevit.md, which names one kernel per step for
#   Layer 3 (d=144, 256 tokens, 2 blocks), Layer 4 (d=192, 64 tokens, 4
#   blocks) and Layer 5 (d=240, 16 tokens, 3 blocks). `count` is the number of
#   transformer blocks times the uses per block. The projections are counted
#   through the single-stream matmul kernels, 4 streams each (the *_p4
#   kernels do the 4 streams in one run and are an alternative, not an addition).
# - Convolutions: ASSUMED from the public MobileViT-S architecture (256x256
#   input; channels 16, 32, 64, 96, 128, 160; MV2 expansion 4). The channel
#   counts agree with this repository's concat kernels (96, 128, 160). Check
#   them against the team's model export before quoting totals (Q13, Q19).
#   Only a representative subset is listed, not every convolution.
name = "MobileViT-S (kernels on master)"

# ---- standard 3x3 convolution -------------------------------------------------
[[layer]]
type = "standard_conv"
name = "MViT-L3 local 3x3, 96->96 @32x32"
kernel = "conv_universal"
values = { height = 32, width = 32, in_channels = 96, out_channels = 96 }
count = 1

[[layer]]
type = "standard_conv"
name = "MViT-L4 local 3x3, 128->128 @16x16"
kernel = "conv_universal"
values = { height = 16, width = 16, in_channels = 128, out_channels = 128 }
count = 1

[[layer]]
type = "standard_conv"
name = "MViT-L5 local 3x3, 160->160 @8x8"
kernel = "conv_universal"
values = { height = 8, width = 8, in_channels = 160, out_channels = 160 }
count = 1

[[layer]]
type = "standard_conv"
name = "book reference: 3x3, 32->32 @64x64"
kernel = "conv_universal"
values = { height = 64, width = 64, in_channels = 32, out_channels = 32 }
count = 0        # not a MobileViT-S layer: kept to compare with the project book (318,564 cycles)

# ---- depthwise 3x3 convolution ------------------------------------------------
[[layer]]
type = "depthwise_conv"
name = "MV2 depthwise 3x3, 64 ch @64x64 (book reference shape)"
kernel = "depthwise_conv_universal"
values = { height = 64, width = 64, in_channels = 64, out_channels = 64, groups = 64 }
count = 1

[[layer]]
type = "depthwise_conv"
name = "MV2 depthwise 3x3, 256 ch @64x64"
kernel = "depthwise_conv_universal"
values = { height = 64, width = 64, in_channels = 256, out_channels = 256, groups = 256 }
count = 2

# ---- pointwise 1x1 convolution ------------------------------------------------
[[layer]]
type = "pointwise_conv"
name = "MV2 project 1x1, 64->32 @128x128"
kernel = "pointwise_conv_unified"
values = { height = 128, width = 128, in_channels = 64, out_channels = 32 }
count = 1

[[layer]]
type = "pointwise_conv"
name = "MViT-L3 1x1, 96->144 @32x32"
kernel = "pointwise_conv_unified"
values = { height = 32, width = 32, in_channels = 96, out_channels = 144 }
count = 1

[[layer]]
type = "pointwise_conv"
name = "MViT-L4 1x1, 128->192 @16x16"
kernel = "pointwise_conv_unified"
values = { height = 16, width = 16, in_channels = 128, out_channels = 192 }
count = 1

[[layer]]
type = "pointwise_conv"
name = "MViT-L5 1x1, 160->240 @8x8"
kernel = "pointwise_conv_unified"
values = { height = 8, width = 8, in_channels = 160, out_channels = 240 }
count = 1

# ---- attention (scores, softmax, attn@V; query-major chain) -------------------
[[layer]]
type = "attention"
name = "L3 QK^T scores 256x36"
kernel = "qk_scores_256x36"
count = 2

[[layer]]
type = "attention"
name = "L3 attn@V 256x36"
kernel = "attn_v_256x36"
count = 2

[[layer]]
type = "attention"
name = "L4 QK^T scores 64x48"
kernel = "qk_scores_64x48"
count = 4

[[layer]]
