name = "softmax over score rows (default case)"
kernel = "softmax_rows"
count = 1        # the default case's shape, not a layer's: shapes per layer still to be set

# ---- MLP / projections (single-stream matmuls, 4 streams per block) -----------
# `weights = ["a"]`: in these kernels input `a` is the weight matrix W and `b`
# the data (kernels/matmul/matmul_x128_c2/kernel.toml:32-38). It matters only
# for residency = "stays_in_xmem": weights always come from DRAM.
[[layer]]
type = "mlp"
name = "L3 QKV 144->432"
kernel = "matmul_432x144_x128"
weights = ["a"]
count = 8

