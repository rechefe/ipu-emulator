# Swin-T (windowed ViT), 224x224 input. NETWORK-ONLY: no kernel in this
# repository was run for these shapes.
#
# Every shape is ASSUMED from the public architecture: Liu et al., "Swin
# Transformer: Hierarchical Vision Transformer using Shifted Windows" (2021),
# section 3.3 and Table 7 (Swin-T: C = 96, depths 2/2/6/2, heads 3/6/12/24,
# window 7, head dimension 32, MLP ratio 4, patch 4; 28M parameters). The
# reference implementation is `swin_tiny_patch4_window7_224` in timm. Written
# by hand from those, without running the model: check it with
# scripts/export_layers.py before quoting it.
#
# Window attention runs on 49 tokens at a time, so an attention layer's count
# is blocks x windows per block (64, 16, 4 and 1 windows in the four stages).
# The cyclic shift and the window partition move data but have no parameters
# and no multiplies; they are not listed.
name = "Swin-T (public architecture, not replayed)"
published_params = 28288354    # timm's swin_tiny_patch4_window7_224; the paper rounds to 28M

[[layer]]
type = "patch_embed"
name = "patch embedding conv 4x4 stride 4, 3->96 @224"
op = "conv"
kernel_size = 4
stride = 4
in_channels = 3
out_channels = 96
height = 224
width = 224
affine = 1
count = 1

[[layer]]
type = "normalization"
name = "LayerNorm after patch embedding"
op = "layernorm"
channels = 96
tokens = 3136
count = 1

[[layer]]
type = "normalization"
name = "stage 1 LayerNorm 3136x96 (2 per block)"
op = "layernorm"
channels = 96
tokens = 3136
count = 4

[[layer]]
type = "mlp"
name = "stage 1 QKV projection 96->288"
op = "linear"
in_features = 96
out_features = 288
tokens = 3136
count = 2

[[layer]]
type = "attention"
name = "stage 1 window attention, 49 tokens, 3 heads x 32 (64 windows per block)"
op = "attention"
tokens = 49
heads = 3
head_dim = 32
count = 128

[[layer]]
type = "embedding"
name = "stage 1 relative position bias table (169 x 3)"
op = "embedding"
elements = 507
count = 2

[[layer]]
type = "mlp"
name = "stage 1 attention output projection 96->96"
op = "linear"
in_features = 96
out_features = 96
tokens = 3136
count = 2

[[layer]]
type = "mlp"
name = "stage 1 MLP fc1 96->384 (GELU)"
op = "linear"
in_features = 96
out_features = 384
tokens = 3136
count = 2

[[layer]]
type = "mlp"
name = "stage 1 MLP fc2 384->96"
op = "linear"
in_features = 384
out_features = 96
tokens = 3136
count = 2

[[layer]]
type = "elementwise"
name = "stage 1 residual add 3136x96 (2 per block)"
op = "add"
elements = 301056
channels = 96
tokens = 3136
count = 4

[[layer]]
type = "normalization"
name = "patch merging 1 LayerNorm 784x384"
op = "layernorm"
channels = 384
tokens = 784
count = 1

[[layer]]
type = "mlp"
name = "patch merging 1 reduction 384->192 (no bias)"
op = "linear"
in_features = 384
out_features = 192
tokens = 784
bias = false
count = 1

[[layer]]
