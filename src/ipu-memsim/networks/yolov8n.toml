# YOLOv8n (nano detector), 640x640 input, 80 classes. NETWORK-ONLY: no kernel
# in this repository was run for these shapes.
#
# Every shape is ASSUMED from the public architecture: the Ultralytics
# `yolov8.yaml` model definition at scale n (depth multiple 0.33, width
# multiple 0.25): backbone Conv / C2f stages at 16, 32, 64, 128 and 256
# channels with 1, 2, 2 and 1 bottlenecks, SPPF, the two-level top-down and
# bottom-up head, and the decoupled Detect head on three scales (box branch 64
# channels, class branch 80 channels). Ultralytics reports 3.2M parameters
# (3,157,200). Written by hand from that definition, without running the
# model: check it with scripts/export_layers.py before quoting it.
#
# Each Conv is convolution + batch norm + SiLU; `affine = 2` counts the batch
# norm's scale and shift per output channel, `affine = 1` a plain bias (the
# last convolution of each Detect branch). Upsampling and concatenation move
# data but have no parameters and no multiplies; they are not listed. SiLU has
# no kernel after a convolution in this repository (STATUS.md).
name = "YOLOv8n (public architecture, not replayed)"
published_params = 3157200

[[layer]]
type = "standard_conv"
name = "P1: conv 3x3 stride 2, 3->16 @640x640"
op = "conv"
kernel_size = 3
stride = 2
in_channels = 3
out_channels = 16
height = 640
width = 640
affine = 2
count = 1

