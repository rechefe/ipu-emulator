[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipu-memsim"
version = "0.1.0"
description = "Memory what-if tool: record a kernel's XMEM access trace once, replay it through swappable memory models"
requires-python = ">=3.10"
dependencies = [
    "ipu-emu",
    "ipu-harness",
    "ipu-isa",
    "numpy>=1.24.0",
    "tomli>=2.0",
]

[tool.uv.sources]
ipu-emu = { path = "../ipu-emu", editable = true }
ipu-harness = { path = "../ipu-harness", editable = true }
ipu-isa = { path = "../ipu-isa", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv]
package = true
