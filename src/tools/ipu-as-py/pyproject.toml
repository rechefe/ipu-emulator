[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipu-as-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "lark>=1.3.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "jsonschema>=4.0",
    "referencing>=0.30",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.0",
    # 1.2.3 depends on properdocs (a MkDocs fork) instead of mkdocs.
    "mkdocs-redirects>=1.2.1,<1.2.3",
]

[project.scripts]
ipu-as = "ipu_as.cli:cli"

[tool.setuptools.package-data]
ipu_as = ["*.lark", "**/*.lark"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.uv]
package = true
