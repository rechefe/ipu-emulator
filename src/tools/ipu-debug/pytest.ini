[pytest]
testpaths = test
# The debugger tests run programs through the emulator, so they keep the
# emulator tests' filters (src/tools/ipu-emu-py/pytest.ini). Listed in order of
# increasing priority: the last matching entry wins.
filterwarnings =
    ignore:.* uses the simulation-only .* slot:UserWarning
    error:\[DEBUG ONLY\]:UserWarning
    error::DeprecationWarning:ipu_emu
    error::DeprecationWarning:ipu_debug
