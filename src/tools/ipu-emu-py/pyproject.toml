[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipu-emu-py"
version = "0.1.0"
description = "IPU cycle-functional emulator in Python"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "ipu-as-py",
    "ipu-isa",
]

[tool.uv.sources]
ipu-as-py = { path = "../ipu-as-py", editable = true }
ipu-isa = { path = "../ipu-isa", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    # test_ipu_math cross-checks the FP8 codec; the emulator does not import it.
    "ml-dtypes>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.uv]
package = true
