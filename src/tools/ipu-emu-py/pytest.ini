[pytest]
testpaths = test
# Listed in order of increasing priority: the last matching entry wins.
filterwarnings =
    # The assembler flags simulation-only slots (ST.ACC in acc_store) at
    # assemble time; the emulator's own [DEBUG ONLY] warning is the one tests assert.
    ignore:.* uses the simulation-only .* slot:UserWarning
    # ST.ACC at run time: a test that runs it must say so with pytest.warns.
    error:\[DEBUG ONLY\]:UserWarning
    error::DeprecationWarning:ipu_emu
