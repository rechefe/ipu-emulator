# Which first-party packages each package may import (E03-02 follow-up).
#
# //tools:test_import_graph reads every Python source under
# src/tools/*/src/<package>/ and fails on an import of a first-party package
# that its row does not list. A package imports itself freely. A package
# with no row here fails the test, so a new package (ipu_harness, the
# debugger) adds its row in the change that creates it.
#
# Edges marked "temporary" are today's code, not the target design; the
# issue named beside each one removes it, and that change deletes the edge.

[allowed]
# The ISA is the root: it depends on no other package (Q31, Q62).
ipu_isa = []

# Artifact generators. E08 moves the docs, SV and VS Code generators here
# from ipu_as (E08-13, E08-14); they read the assembler's token classes, so
# those issues add ipu_as here.
ipu_gen = ["ipu_isa"]

ipu_as = [
    "ipu_isa",
    "ipu_gen",  # temporary: compound_inst renders the layout SVG (E08-14 removes it)
]

ipu_emu = [
    "ipu_isa",
    "ipu_as",  # temporary: execute and the debuggers use CompoundInst (E03-18 removes it)
]

ipu_apps = ["ipu_isa", "ipu_as", "ipu_emu"]
