# Which first-party packages each package may import (E03-02 follow-up).
#
# //tools:test_import_graph reads every Python source under
# src/tools/*/src/<package>/ and fails on an import of a first-party package
# that its row does not list. A package imports itself freely. A new package
# (ipu_debug) adds its row here and its :py_sources to the test's data in the
# change that creates it; until then the test fails on a package with sources
# and no row, and on any import of an ipu_* package it has no sources for.
#
# "Nothing imports X except Y" is a row matter: list X only in Y's row.
#
# A key is a package or a subpackage (a quoted dotted key such as
# "ipu_kernels.reference", E06-01). A source file follows the longest key that
# is its module or a parent of it, so a subpackage row replaces its package's
# row for the files under it; [allowed] and [deferred] are looked up
# separately.
#
# Edges marked "temporary" are today's code, not the target design; the
# issue named beside each one removes it, and that change deletes the edge.

[allowed]
# The ISA is the root: it depends on no other package (Q31, Q62).
ipu_isa = []

# Artifact generators. E08 moves the docs, SV and VS Code generators here
# from ipu_as (E08-13, E08-14); they read the assembler's token classes, so
# those issues add ipu_as here.
ipu_gen = ["ipu_isa"]

ipu_as = [
    "ipu_isa",
    "ipu_gen",  # temporary: compound_inst renders the layout SVG (E08-14 removes it)
]

ipu_emu = [
    "ipu_isa",
    "ipu_as",  # temporary: execute and the debuggers use CompoundInst (E03-18 removes it; E04-18 checks)
]

# ipu_isa is allowed but not imported today.
ipu_apps = ["ipu_isa", "ipu_as", "ipu_emu"]

# The kernel framework (E06): the ISA, the assembler's session API and the
# emulator's reference-model API. Never ipu_apps, ipu_kernels or ipu_debug.
ipu_harness = ["ipu_isa", "ipu_as", "ipu_emu"]

# Kernel-side shared code builds on the framework. No row lists ipu_kernels:
# kernel tests live under kernels/, outside these rows, and the registry
# loader (E06-16) adds the edge it needs, deferred to a function.
ipu_kernels = ["ipu_harness"]

# A shared reference never imports the emulator, not even through the
# framework: one that does is a copy of the code under test.
"ipu_kernels.reference" = ["ipu_isa"]

[deferred]
# Modules a key's sources may import only inside a function (or under
# `if TYPE_CHECKING:`), never when the module itself is imported. Any module,
# first or third party; a first-party one must also be in the key's [allowed]
# row.

# torch is a test-only dependency: the checker loads the reference lazily (E06-09).
ipu_harness = ["torch"]
